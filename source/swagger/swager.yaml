openapi: 3.0.3
info:
  title: Training Requests API
  version: 1.0.0
  description: CRUD API для модуля «Заявки на обучение»
servers:
- url: http://localhost:8080
  description: Local server
tags:
- name: Auth
  description: Авторизация и данные текущего пользователя
- name: Applications
  description: Работа с заявками на обучение
security:
- BearerAuth: []
paths:
  /api/v1/users/current:
    get:
      tags:
      - Auth
      summary: Получить текущего пользователя
      description: Возвращает данные текущего авторизованного пользователя по Bearer JWT токену.
      operationId: getCurrentUser
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/GetCurrentUser200Response'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/applications:
    get:
      tags:
      - Applications
      summary: Получить список заявок на обучение
      description: 'Возвращает список заявок с учётом роли текущего пользователя. Заявитель видит свои заявки, Согласующий
        — доступные ему заявки. Если список пустой, возвращается 200 с пустым массивом items.'
      operationId: getApplications
      parameters:
      - name: page
        in: query
        required: false
        description: Номер страницы
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        required: false
        description: Количество заявок на странице
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      - name: search
        in: query
        required: false
        description: Поиск по номеру заявки или названию курса
        schema:
          type: string
        example: TR-2026
      - name: application_state_id
        in: query
        required: false
        description: Фильтр по ID статуса заявки
        schema:
          type: integer
        example: 1
      - name: organization_id
        in: query
        required: false
        description: Фильтр по ID организации Заявителя
        schema:
          type: integer
        example: 1
      - name: created_by
        in: query
        required: false
        description: Фильтр по ID Заявителя
        schema:
          type: integer
        example: 10
      - name: approver_id
        in: query
        required: false
        description: Фильтр по ID Согласующего
        schema:
          type: integer
        example: 2
      - name: sort_by
        in: query
        required: false
        description: Поле для сортировки
        schema:
          type: string
          enum:
          - number_application
          - updated_at
          - course_name
          - organization_name
          - created_by_full_name
          - approver_full_name
        example: updated_at
      - name: sort_order
        in: query
        required: false
        description: Направление сортировки
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        example: desc
      responses:
        '200':
          $ref: '#/components/responses/GetApplications200Response'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags:
      - Applications
      summary: Создать заявку на обучение
      description: 'Создаёт новую заявку на обучение. Создатель заявки определяется по текущему авторизованному пользователю.
        Статус заявки задаётся через application_state_id, например «Черновик» или «Ожидает рассмотрения».

        '
      operationId: createApplication
      requestBody:
        $ref: '#/components/requestBodies/CreateApplicationRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/CreateApplication200Response'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/applications/{id}:
    get:
      tags:
      - Applications
      summary: Получить заявку по ID
      description: 'Возвращает карточку заявки на обучение, включая данные курса, статуса, заявителя, согласующего, сотрудников,
        записанных на курс, и комментарии.

        '
      operationId: getApplicationById
      parameters:
      - name: id
        in: path
        required: true
        description: ID заявки
        schema:
          type: integer
        example: 1
      responses:
        '200':
          $ref: '#/components/responses/GetApplicationById200Response'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    patch:
      summary: Обновление заявки
      description: |
        Обновляет данные заявки.

        Редактирование доступно только создателю заявки для заявок
        в статусах «Черновик» или «На корректировке».

        Если пользователь не является создателем заявки, API возвращает ошибку 403 Forbidden.
        Если заявка находится в другом статусе, API возвращает ошибку 400 Bad Request.
      tags:
        - Applications
      parameters:
        - name: id
          in: path
          required: true
          description: ID заявки
          schema:
            type: integer
            example: 1
      requestBody:
        $ref: '#/components/requestBodies/UpdateApplicationRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/UpdateApplication200Response'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                applicationCannotBeUpdatedByState:
                  summary: Заявка не может быть обновлена из-за статуса
                  value:
                    code: 400
                    message: Заявка не может быть обновлена
                    errors:
                      - field: application_state
                        message: Заявка может быть обновлена только в статусе «Черновик» или «На корректировке»
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                applicationUpdateForbiddenNotCreator:
                  $ref: '#/components/examples/ApplicationUpdateForbiddenNotCreatorExample'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    delete:
      summary: Удаление черновика заявки
      description: Удаляет заявку только в статусе «Черновик». Если заявка находится в другом статусе, удаление не выполняется.
      tags:
        - Applications
      parameters:
        - name: id
          in: path
          required: true
          description: ID заявки
          schema:
            type: integer
            example: 1
      responses:
        '200':
          $ref: '#/components/responses/DeleteApplicationDraft200Response'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                applicationNotDraft:
                  $ref: '#/components/examples/ApplicationNotDraftErrorExample'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/applications/{id}/state:
    post:
      summary: Изменение статуса заявки
      description: |
        Изменяет статус заявки при рассмотрении.

        Метод используется Согласующим для выполнения действий:
        - согласование заявки;
        - отклонение заявки;
        - отправка заявки на корректировку.

        В запросе передается новый статус заявки через application_state_id.
        Комментарий является опциональным, но может быть обязательным на уровне бизнес-логики
        для отдельных статусов, например при отклонении или отправке на корректировку.
      tags:
        - Applications
      parameters:
        - name: id
          in: path
          required: true
          description: ID заявки
          schema:
            type: integer
            example: 1
      requestBody:
        $ref: '#/components/requestBodies/ChangeApplicationStateRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/ChangeApplicationState200Response'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidApplicationStateTransition:
                  $ref: '#/components/examples/InvalidApplicationStateTransitionExample'
                commentRequired:
                  $ref: '#/components/examples/ApplicationStateCommentRequiredExample'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                approverIsCreator:
                  $ref: '#/components/examples/ApplicationApproverIsCreatorExample'
                noApplicationAccess:
                  $ref: '#/components/examples/ApplicationStateChangeForbiddenExample'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/applications/downloads:
    get:
      summary: Скачивание шаблона Excel для загрузки учеников
      description: Возвращает Excel-файл установленного формата для последующего заполнения и загрузки списка учеников в заявку.
      tags:
        - Applications
      responses:
        '200':
          $ref: '#/components/responses/DownloadApplicationStudentsTemplate200Response'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      summary: Скачивание выбранных заявок
      description: |
        Формирует файл для скачивания выбранных заявок.

        Если передана одна заявка, API возвращает PDF-файл.
        Если передано несколько заявок, API возвращает ZIP-архив с PDF-файлами заявок.
      tags:
        - Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadApplicationsRequest'
            example:
              application_ids:
                - 1
                - 2
                - 3
      responses:
        '200':
          $ref: '#/components/responses/DownloadApplications200Response'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/applications/downloads/excel:
    post:
      summary: Скачивание списка заявок в Excel
      description: |
        Формирует Excel-файл со списком заявок по переданным фильтрам.

        Фильтры соответствуют фильтрам метода получения списка заявок.
        Если фильтры не переданы, API возвращает Excel-файл со всеми заявками,
        доступными текущему пользователю с учетом его роли и прав доступа.
      tags:
        - Applications
      requestBody:
        $ref: '#/components/requestBodies/DownloadApplicationsExcelRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/DownloadApplicationsExcel200Response'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  requestBodies:
    CreateApplicationRequestBody:
      description: Данные для создания заявки на обучение
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateApplicationRequest'
          example:
            course_id: 5
            start_date: '2026-06-15'
            end_date: '2026-06-20'
            application_state_id: 1
            created_by_id: 2
            employee_ids:
            - 10
            - 11
            - 12
    UpdateApplicationRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateApplicationRequest'
          example:
            course_id: 5
            start_date: 2026-07-01
            end_date: 2026-07-10
            employee_ids:
              - 10
              - 11
              - 12
    ChangeApplicationStateRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChangeApplicationStateRequest'
          example:
            application_state_id: 3
            comment: Необходимо скорректировать список учеников
    DownloadApplicationsExcelRequestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DownloadApplicationsExcelRequest'
          example:
            search: Java
            application_state_id: 1
            organization_id: 2
            course_id: 5
            start_date_from: 2026-06-01
            start_date_to: 2026-06-30
            end_date_from: 2026-06-01
            end_date_to: 2026-06-30
            created_at_from: 2026-06-01
            created_at_to: 2026-06-30
            sort_by: created_at
            sort_direction: desc
  responses:
    GetCurrentUser200Response:
      description: Данные текущего пользователя успешно получены
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentUserResponse'
    GetApplications200Response:
      description: Список заявок успешно получен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApplicationsListResponse'
    CreateApplication200Response:
      description: Заявка успешно создана
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateApplicationResponse'
    ChangeApplicationState200Response:
      description: Статус заявки успешно изменен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApplicationDetailsResponse'
          example:
            id: 1
            number_application: APP-2026-0001
            start_date: 2026-07-01
            end_date: 2026-07-10
            application_state:
              id: 3
              code: correction
              name: На корректировке
            course:
              id: 5
              name: Основы информационной безопасности
            created_by:
              id: 10
              first_name: Иван
              middle_name: Иванович
              last_name: Иванов
            approver:
              id: 2
              first_name: Петр
              middle_name: Петрович
              last_name: Петров
            employees:
              - id: 10
                first_name: Иван
                middle_name: Иванович
                last_name: Иванов
                email: ivanov@example.com
                phone: "+79001234567"
                departament:
                  id: 1
                  name: Отдел разработки
                organization:
                  id: 1
                  name: ООО Ромашка
                position:
                  id: 1
                  name: Инженер-программист
            comments:
              - content: Необходимо скорректировать список учеников
                created_by:
                  id: 2
                  first_name: Петр
                  middle_name: Петрович
                  last_name: Петров
            created_at: 2026-06-17T10:00:00Z
            updated_at: 2026-06-17T12:00:00Z
    GetApplicationById200Response:
      description: Заявка успешно получена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApplicationDetailsResponse'
          example:
            id: 1
            number_application: APP-2026-0001
            course:
              id: 5
              name: Основы информационной безопасности
            start_date: '2026-06-15'
            end_date: '2026-06-20'
            application_state:
              id: 1
              code: WAITING_REVIEW
              name: Ожидает рассмотрения
            created_by:
              id: 10
              first_name: Иван
              middle_name: Иванович
              last_name: Иванов
              email: ivanov@example.com
              phone: '+79000000000'
            approver:
              id: 2
              first_name: Пётр
              middle_name: Петрович
              last_name: Петров
            organization:
              id: 1
              name: ООО Ромашка
            employees:
            - id: 10
              first_name: Иван
              middle_name: Иванович
              last_name: Иванов
              email: ivanov@example.com
              phone: '+79000000000'
              position:
                id: 1
                name: Backend-разработчик
              departament:
                id: 1
                name: Отдел разработки
              organization:
                id: 1
                name: ООО Ромашка
            comments:
            - content: Заявка требует корректировки списка сотрудников
              created_by:
                id: 2
                first_name: Пётр
                middle_name: Петрович
                last_name: Петров
            created_at: '2026-06-15T10:30:00Z'
            updated_at: '2026-06-15T12:00:00Z'
    DeleteApplicationDraft200Response:
      description: Черновик заявки успешно удален
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteApplicationDraftResponse'
          example:
            message: Черновик заявки успешно удален
    DownloadApplicationStudentsTemplate200Response:
      description: Excel-шаблон для загрузки учеников успешно сформирован
      headers:
        Content-Disposition:
          description: Имя файла для скачивания
          schema:
            type: string
            example: attachment; filename="application_students_template.xlsx"
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
          examples:
            applicationStudentsTemplate:
              summary: Excel-шаблон для загрузки учеников
              value: Excel-файл шаблона
    DownloadApplications200Response:
      description: Файл с выбранными заявками успешно сформирован
      headers:
        Content-Disposition:
          description: Имя файла для скачивания
          schema:
            type: string
            example: attachment; filename="applications.zip"
      content:
        application/pdf:
          schema:
            type: string
            format: binary
          examples:
            singleApplicationPdf:
              summary: PDF-файл одной заявки
              value: PDF-файл заявки
        application/zip:
          schema:
            type: string
            format: binary
          examples:
            multipleApplicationsZip:
              summary: ZIP-архив с PDF-файлами нескольких заявок
              value: ZIP-архив с PDF-файлами заявок
    DownloadApplicationsExcel200Response:
      description: Excel-файл со списком заявок успешно сформирован
      headers:
        Content-Disposition:
          description: Имя файла для скачивания
          schema:
            type: string
            example: attachment; filename="applications.xlsx"
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
          examples:
            applicationsExcel:
              summary: Excel-файл со списком заявок
              value: Excel-файл со списком заявок
    BadRequestErrorResponse:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: BAD_REQUEST
            message: Некорректный запрос
    UnauthorizedErrorResponse:
      description: Пользователь не авторизован или токен недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: Пользователь не авторизован
    ForbiddenErrorResponse:
      description: Доступ запрещен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 403
            message: Доступ запрещен
    NotFoundErrorResponse:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: Ресурс не найден
    TooManyRequestsErrorResponse:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          description: Количество секунд до повторной попытки
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: TOO_MANY_REQUESTS
            message: Превышен лимит запросов
    InternalServerErrorResponse:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_SERVER_ERROR
            message: Внутренняя ошибка сервера
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          example: INVALID_REQUEST
        message:
          type: string
          description: Описание ошибки
          example: Некорректный запрос
        details:
          type: array
          nullable: true
          description: Детализация ошибок по полям или параметрам
          items:
            type: object
            properties:
              field:
                type: string
                example: size
              message:
                type: string
                example: Значение size не должно превышать 100
    CurrentUserResponse:
      type: object
      required:
      - id
      - full_name
      - phone
      - email
      - organization_name
      - role_code
      properties:
        id:
          type: integer
