openapi: 3.0.3
info:
  title: Training Requests API
  version: 1.0.0
  description: CRUD API для модуля «Заявки на обучение»
servers:
- url: http://localhost:8080
  description: Local server
tags:
- name: Auth
  description: Авторизация и данные текущего пользователя
- name: Applications
  description: Работа с заявками на обучение
security:
- BearerAuth: []
paths:
  /api/v1/users/current:
    get:
      tags:
      - Auth
      summary: Получить текущего пользователя
      description: Возвращает данные текущего авторизованного пользователя по Bearer JWT токену.
      operationId: getCurrentUser
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/GetCurrentUser200Response'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/applications:
    get:
      tags:
      - Applications
      summary: Получить список заявок на обучение
      description: 'Возвращает список заявок с учётом роли текущего пользователя. Заявитель видит свои заявки, Согласующий
        — доступные ему заявки. Если список пустой, возвращается 200 с пустым массивом items.'
      operationId: getApplications
      parameters:
      - name: page
        in: query
        required: false
        description: Номер страницы
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        required: false
        description: Количество заявок на странице
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      - name: search
        in: query
        required: false
        description: Поиск по номеру заявки или названию курса
        schema:
          type: string
        example: TR-2026
      - name: application_state_id
        in: query
        required: false
        description: Фильтр по ID статуса заявки
        schema:
          type: integer
        example: 1
      - name: organization_id
        in: query
        required: false
        description: Фильтр по ID организации Заявителя
        schema:
          type: integer
        example: 1
      - name: created_by
        in: query
        required: false
        description: Фильтр по ID Заявителя
        schema:
          type: integer
        example: 10
      - name: approver_id
        in: query
        required: false
        description: Фильтр по ID Согласующего
        schema:
          type: integer
        example: 2
      - name: sort_by
        in: query
        required: false
        description: Поле для сортировки
        schema:
          type: string
          enum:
          - number_application
          - updated_at
          - course_name
          - organization_name
          - created_by_full_name
          - approver_full_name
        example: updated_at
      - name: sort_order
        in: query
        required: false
        description: Направление сортировки
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        example: desc
      responses:
        '200':
          $ref: '#/components/responses/GetApplications200Response'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags:
      - Applications
      summary: Создать заявку на обучение
      description: 'Создаёт новую заявку на обучение. Создатель заявки определяется по текущему авторизованному пользователю.
        Статус заявки задаётся через application_state_id, например «Черновик» или «Ожидает рассмотрения».

        '
      operationId: createApplication
      requestBody:
        $ref: '#/components/requestBodies/CreateApplicationRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/CreateApplication200Response'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/applications/{id}:
    get:
      tags:
      - Applications
      summary: Получить заявку по ID
      description: 'Возвращает карточку заявки на обучение, включая данные курса, статуса, заявителя, согласующего, сотрудников,
        записанных на курс, и комментарии.

        '
      operationId: getApplicationById
      parameters:
      - name: id
        in: path
        required: true
        description: ID заявки
        schema:
          type: integer
        example: 1
      responses:
        '200':
          $ref: '#/components/responses/GetApplicationById200Response'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    delete:
      summary: Удаление черновика заявки
      description: Удаляет заявку только в статусе «Черновик». Если заявка находится в другом статусе, удаление не выполняется.
      tags:
        - Applications
      parameters:
        - name: id
          in: path
          required: true
          description: ID заявки
          schema:
            type: integer
            example: 1
      responses:
        '200':
          $ref: '#/components/responses/DeleteApplicationDraft200Response'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                applicationNotDraft:
                  $ref: '#/components/examples/ApplicationNotDraftErrorExample'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  requestBodies:
    CreateApplicationRequestBody:
      description: Данные для создания заявки на обучение
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateApplicationRequest'
          example:
            course_id: 5
            start_date: '2026-06-15'
            end_date: '2026-06-20'
            application_state_id: 1
            created_by_id: 2
            employee_ids:
            - 10
            - 11
            - 12
  
  responses:
    GetCurrentUser200Response:
      description: Данные текущего пользователя успешно получены
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentUserResponse'
    GetApplications200Response:
      description: Список заявок успешно получен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApplicationsListResponse'
    CreateApplication200Response:
      description: Заявка успешно создана
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateApplicationResponse'
    GetApplicationById200Response:
      description: Заявка успешно получена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApplicationDetailsResponse'
          example:
            id: 1
            number_application: APP-2026-0001
            course:
              id: 5
              name: Основы информационной безопасности
            start_date: '2026-06-15'
            end_date: '2026-06-20'
            application_state:
              id: 1
              code: WAITING_REVIEW
              name: Ожидает рассмотрения
            created_by:
              id: 10
              first_name: Иван
              middle_name: Иванович
              last_name: Иванов
              email: ivanov@example.com
              phone: '+79000000000'
            approver:
              id: 2
              first_name: Пётр
              middle_name: Петрович
              last_name: Петров
            organization:
              id: 1
              name: ООО Ромашка
            employees:
            - id: 10
              first_name: Иван
              middle_name: Иванович
              last_name: Иванов
              email: ivanov@example.com
              phone: '+79000000000'
              position:
                id: 1
                name: Backend-разработчик
              departament:
                id: 1
                name: Отдел разработки
              organization:
                id: 1
                name: ООО Ромашка
            comments:
            - content: Заявка требует корректировки списка сотрудников
              created_by:
                id: 2
                first_name: Пётр
                middle_name: Петрович
                last_name: Петров
            created_at: '2026-06-15T10:30:00Z'
            updated_at: '2026-06-15T12:00:00Z'
    DeleteApplicationDraft200Response:
      description: Черновик заявки успешно удален
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteApplicationDraftResponse'
          example:
            message: Черновик заявки успешно удален
    BadRequestErrorResponse:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: BAD_REQUEST
            message: Некорректный запрос
    UnauthorizedErrorResponse:
      description: Пользователь не авторизован или токен недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: Пользователь не авторизован
    ForbiddenErrorResponse:
      description: Доступ запрещен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 403
            message: Доступ запрещен
    NotFoundErrorResponse:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: Ресурс не найден
    TooManyRequestsErrorResponse:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          description: Количество секунд до повторной попытки
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: TOO_MANY_REQUESTS
            message: Превышен лимит запросов
    InternalServerErrorResponse:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_SERVER_ERROR
            message: Внутренняя ошибка сервера
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          example: INVALID_REQUEST
        message:
          type: string
          description: Описание ошибки
          example: Некорректный запрос
        details:
          type: array
          nullable: true
          description: Детализация ошибок по полям или параметрам
          items:
            type: object
            properties:
              field:
                type: string
                example: size
              message:
                type: string
                example: Значение size не должно превышать 100
    CurrentUserResponse:
      type: object
      required:
      - id
      - full_name
      - phone
      - email
      - organization_name
      - role_code
      properties:
        id:
          type: integer
          description: ID пользователя
          example: 1
        full_name:
          type: string
          description: ФИО пользователя
          example: Иванов Иван Иванович
        phone:
          type: string
          description: Телефон пользователя
          example: '+79000000000'
        email:
          type: string
          format: email
          description: Email пользователя
          example: ivanov@example.com
        organization_name:
          type: string
          description: Название организации пользователя
          example: ООО Ромашка
        role_code:
          type: string
          description: Код роли пользователя
          example: APPLICANT
    ApplicationsListResponse:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          description: Список заявок
          items:
            type: object
            required:
            - id
            - number_application
            - course
            - start_date
            - end_date
            - application_state
            - created_by
            - organization
            - created_at
            - updated_at
            properties:
              id:
                type: integer
                description: ID заявки
                example: 1
              number_application:
                type: string
                description: Номер заявки
                example: APP-2026-0001
              course:
                type: object
                description: Курс обучения
                required:
                - id
                - name
                properties:
                  id:
                    type: integer
                    description: ID курса
                    example: 5
                  name:
                    type: string
                    description: Название курса
                    example: Основы информационной безопасности
              start_date:
                type: string
                format: date
                description: Дата начала обучения
                example: '2026-06-15'
              end_date:
                type: string
                format: date
                description: Дата окончания обучения
                example: '2026-06-20'
              application_state:
                type: object
                description: Статус заявки
                required:
                - id
                - code
                - name
                properties:
                  id:
                    type: integer
                    description: ID статуса заявки
                    example: 1
                  code:
                    type: string
                    description: Код статуса заявки
                    example: WAITING_REVIEW
                  name:
                    type: string
                    description: Название статуса заявки
                    example: Ожидает рассмотрения
              created_by:
                type: object
                description: Сотрудник, создавший заявку
                required:
                - id
                - full_name
                properties:
                  id:
                    type: integer
                    description: ID сотрудника-заявителя
                    example: 10
                  full_name:
                    type: string
                    description: ФИО заявителя
                    example: Иванов Иван Иванович
              approver:
                type: object
                nullable: true
                description: Пользователь, проверяющий заявку
                required:
                - id
                - full_name
                properties:
                  id:
                    type: integer
                    description: ID пользователя-согласующего
                    example: 2
                  full_name:
                    type: string
                    description: ФИО согласующего
                    example: Петров Пётр Петрович
              organization:
                type: object
                description: Организация заявителя
                required:
                - id
                - name
                properties:
                  id:
                    type: integer
                    description: ID организации
                    example: 1
                  name:
                    type: string
                    description: Название организации
                    example: ООО Ромашка
              created_at:
                type: string
                format: date-time
                description: Дата и время создания заявки
                example: '2026-06-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                description: Дата и время последнего обновления заявки
                example: '2026-06-15T12:00:00Z'
        pagination:
          type: object
          required:
          - page
          - size
          - total
          - total_pages
          properties:
            page:
              type: integer
              description: Текущая страница
              example: 1
            size:
              type: integer
              description: Количество записей на странице
              example: 20
            total:
              type: integer
              description: Общее количество записей
              example: 125
            total_pages:
              type: integer
              description: Общее количество страниц
              example: 7
    CreateApplicationResponse:
      type: object
      required:
      - id
      - number_application
      - course
      - start_date
      - end_date
      - application_state
      - created_by
      - organization
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          description: ID заявки
          example: 1
        number_application:
          type: string
          description: Номер заявки
          example: APP-2026-0001
        course:
          type: object
          description: Курс обучения
          required:
          - id
          - name
          properties:
            id:
              type: integer
              description: ID курса
              example: 5
            name:
              type: string
              description: Название курса
              example: Основы информационной безопасности
        start_date:
          type: string
          format: date
          description: Дата начала обучения
          example: '2026-06-15'
        end_date:
          type: string
          format: date
          description: Дата окончания обучения
          example: '2026-06-20'
        application_state:
          type: object
          description: Статус заявки
          required:
          - id
          - code
          - name
          properties:
            id:
              type: integer
              description: ID статуса заявки
              example: 1
            code:
              type: string
              description: Код статуса заявки
              example: DRAFT
            name:
              type: string
              description: Название статуса заявки
              example: Черновик
        created_by:
          type: object
          description: Сотрудник, создавший заявку
          required:
          - id
          - full_name
          properties:
            id:
              type: integer
              description: ID сотрудника-заявителя
              example: 10
            full_name:
              type: string
              description: ФИО заявителя
              example: Иванов Иван Иванович
        approver:
          type: object
          nullable: true
          description: Пользователь, проверяющий заявку
          required:
          - id
          - full_name
          properties:
            id:
              type: integer
              description: ID пользователя-согласующего
              example: 2
            full_name:
              type: string
              description: ФИО согласующего
              example: Петров Пётр Петрович
        organization:
          type: object
          description: Организация заявителя
          required:
          - id
          - name
          properties:
            id:
              type: integer
              description: ID организации
              example: 1
            name:
              type: string
              description: Название организации
              example: ООО Ромашка
        employees:
          type: array
          description: Сотрудники, добавленные в заявку
          items:
            type: object
            required:
            - id
            - first_name
            - last_name
            - email
            - phone
            - position
            - departament
            - organization
            properties:
              id:
                type: integer
                description: ID сотрудника
                example: 10
              first_name:
                type: string
                description: Имя сотрудника
                example: Иван
              middle_name:
                type: string
                nullable: true
                description: Отчество сотрудника
                example: Иванович
              last_name:
                type: string
                description: Фамилия сотрудника
                example: Иванов
              email:
                type: string
                format: email
                description: Email сотрудника
                example: ivanov@example.com
              phone:
                type: string
                description: Телефон сотрудника
                example: '+79000000000'
              position:
                type: object
                description: Должность сотрудника
                required:
                - id
                - name
                properties:
                  id:
                    type: integer
                    description: ID должности
                    example: 1
                  name:
                    type: string
                    description: Название должности
                    example: Backend-разработчик
              departament:
                type: object
                description: Подразделение сотрудника
                required:
                - id
                - name
                properties:
                  id:
                    type: integer
                    description: ID подразделения
                    example: 1
                  name:
                    type: string
                    description: Название подразделения
                    example: Отдел разработки
              organization:
                type: object
                description: Организация сотрудника
                required:
                - id
                - name
                properties:
                  id:
                    type: integer
                    description: ID организации
                    example: 1
                  name:
                    type: string
                    description: Название организации
                    example: ООО Ромашка
        created_at:
          type: string
          format: date-time
          description: Дата и время создания заявки
          example: '2026-06-15T10:30:00Z'
        updated_at:
          type: string
          format: date-time
          description: Дата и время последнего обновления заявки
          example: '2026-06-15T10:30:00Z'
    ApplicationDetailsResponse:
      type: object
      required:
      - id
      - number_application
      - course
      - start_date
      - end_date
      - application_state
      - created_by
      - organization
      - employees
      - comments
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          description: ID заявки
          example: 1
        number_application:
          type: string
          description: Номер заявки
          example: APP-2026-0001
        course:
          type: object
          description: Курс обучения
          required:
          - id
          - name
          properties:
            id:
              type: integer
              description: ID курса
              example: 5
            name:
              type: string
              description: Название курса
              example: Основы информационной безопасности
        start_date:
          type: string
          format: date
          description: Дата начала обучения
          example: '2026-06-15'
        end_date:
          type: string
          format: date
          description: Дата окончания обучения
          example: '2026-06-20'
        application_state:
          type: object
          description: Статус заявки
          required:
          - id
          - code
          - name
          properties:
            id:
              type: integer
              description: ID статуса заявки
              example: 1
            code:
              type: string
              description: Код статуса заявки
              example: WAITING_REVIEW
            name:
              type: string
              description: Название статуса заявки
              example: Ожидает рассмотрения
        created_by:
          type: object
          description: Сотрудник, создавший заявку
          required:
          - id
          - first_name
          - last_name
          - email
          - phone
          properties:
            id:
              type: integer
              description: ID сотрудника-заявителя
              example: 10
            first_name:
              type: string
              description: Имя заявителя
              example: Иван
            middle_name:
              type: string
              nullable: true
              description: Отчество заявителя
