openapi: 3.0.2

info:
  title: Training API
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1

paths:
  /users/current:
    $ref: "./src/users/api.yaml#/paths/~1users~1current"

  /applications/search:
    $ref: "./src/applications/api.yaml#/paths/~1applications~1search"

  /applications:
    $ref: "./src/applications/api.yaml#/paths/~1applications"

  /applications/{id}:
    $ref: "./src/applications/api.yaml#/paths/~1applications~1{id}"

  /applications/downloads:
    $ref: "./src/applications/api.yaml#/paths/~1applications~1downloads"

  /applications/downloads/excel:
    $ref: "./src/applications/api.yaml#/paths/~1applications~1downloads~1excel"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
