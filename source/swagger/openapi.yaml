openapi: 3.0.2

info:
  title: Training API
  version: 1.0.0

servers:
  - url: https://portal.example.com/api/v1

tags:
  - name: LMS Integration
    description: Интеграция с системой дистанционного обучения

paths:
  /users/current:
    $ref: "./src/users/api.yaml#/paths/~1users~1current"

  /applications/search:
    $ref: "./src/applications/api.yaml#/paths/~1applications~1search"

  /applications:
    $ref: "./src/applications/api.yaml#/paths/~1applications"

  /applications/{id}:
    $ref: "./src/applications/api.yaml#/paths/~1applications~1{id}"

  /applications/downloads:
    $ref: "./src/applications/api.yaml#/paths/~1applications~1downloads"

  /applications/downloads/excel:
    $ref: "./src/applications/api.yaml#/paths/~1applications~1downloads~1excel"

  /students/search:
    $ref: "./src/students/api.yaml#/paths/~1students~1search"

  /lms/courses:
    $ref: "./src/integrations/lms/api.yaml#/paths/~1lms~1courses"

  /lms/applications:
    $ref: "./src/integrations/lms/api.yaml#/paths/~1lms~1applications"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
