components:
  schemas:

    User:
      type: object
      description: Базовая сущность пользователя (внутренняя модель)
      required:
        - id
        - active
        - employee_id
        - created_at
        - updated_at
      properties:

        id:
          type: integer
          format: int64
          description: ID пользователя
          example: 1

        active:
          type: boolean
          description: Активен ли пользователь
          example: true

        employee_id:
          type: integer
          format: int64
          description: ID сотрудника
          example: 10

        created_at:
          type: string
          format: date-time
          description: Дата создания пользователя
          example: "2026-06-15T10:00:00Z"

        updated_at:
          type: string
          format: date-time
          description: Дата обновления пользователя
          example: "2026-06-15T10:30:00Z"


    CurrentUser:
      type: object
      description: Публичное представление текущего пользователя (без auth/security данных)
      required:
        - id
        - active
        - role_code
        - organization
        - contacts
      properties:

        id:
          $ref: "#/components/schemas/User/properties/id"

        active:
          $ref: "#/components/schemas/User/properties/active"

        role_code:
          type: string
          description: Код роли пользователя (вычисляется на основе employee/permissions)
          example: APPLICANT

        organization:
          $ref: "../organizations/models.yaml#/components/schemas/OrganizationShort"

        contacts:
          $ref: "../employees/models.yaml#/components/schemas/EmployeeContacts"

    UserShort:
      type: object
      description: Краткое представление пользователя (ID + контакты сотрудника)
      required:
        - id
        - contacts
      properties:

        id:
          $ref: "#/components/schemas/User/properties/id"

        contacts:
          $ref: "../employees/models.yaml#/components/schemas/EmployeeContacts"
