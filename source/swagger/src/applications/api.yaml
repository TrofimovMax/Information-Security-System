paths:
  /applications/search:
    post:
      tags:
        - Applications
      summary: Получить список заявок на обучение (с фильтрами)
      operationId: searchApplications
      security:
        - BearerAuth: []

      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/ApplicationListFilters"

      responses:
        '200':
          description: Список заявок успешно получен
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ApplicationsListResponse"

        '400':
          $ref: "../common/responses.yaml#/components/responses/BadRequestErrorResponse"

        '401':
          $ref: "../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../common/responses.yaml#/components/responses/ForbiddenErrorResponse"

        '429':
          $ref: "../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../common/responses.yaml#/components/responses/InternalServerErrorResponse"

  /applications:
    post:
      tags:
        - Applications
      summary: Создать заявку (черновик или на рассмотрение)
      description: >
        Создаёт заявку на обучение.
        Поддерживает создание черновика и отправку на рассмотрение.
      operationId: createApplication
      security:
        - BearerAuth: []

      parameters:
        - $ref: "../common/parameters.yaml#/components/parameters/IdempotencyKeyHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/CreateApplicationRequest"

      responses:
        '201':
          description: Заявка успешно создана или сохранена как черновик
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - message
                properties:
                  number_application:
                    type: string
                    description: Номер заявки
                    example: APP-2026-0001

                  message:
                    type: string
                    description: Результат операции
                    example: Заявка успешно создана
              examples:
                created:
                  summary: Заявка отправлена на рассмотрение
                  value:
                    number_application: APP-2026-0001
                    message: Заявка успешно создана

                draft:
                  summary: Черновик создан
                  value:
                    number_application: APP-2026-0002
                    message: Черновик создан

        '400':
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ApplicationErrorResponse"
              examples:
                duplicateStudents:
                  $ref: "./examples.yaml#/DuplicateStudentsInApplicationExample"
                studentsNotFound:
                  $ref: "./examples.yaml#/StudentsNotFoundInApplicationExample"
                courseNotFound:
                  $ref: "./examples.yaml#/CourseNotFoundInApplicationExample"
                validationError:
                  $ref: "./examples.yaml#/ValidationErrorExample"

        '401':
          $ref: "../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../common/responses.yaml#/components/responses/ForbiddenErrorResponse"

        '429':
          $ref: "../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../common/responses.yaml#/components/responses/InternalServerErrorResponse"

  /applications/{id}:
    get:
      tags:
        - Applications
      summary: Получить заявку по ID
      description: >
        Возвращает полную карточку заявки на обучение.
      operationId: getApplicationById
      security:
        - BearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID заявки

      responses:
        '200':
          description: Заявка успешно получена
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ApplicationDetailsResponse"

              example:
                id: 1
                number_application: APP-2026-0001
                course:
                  id: 5
                  name: Основы информационной безопасности
                start_date: 2026-06-15
                end_date: 2026-06-20
                application_state:
                  id: 1
                  code: WAITING_REVIEW
                  name: Ожидает рассмотрения
                created_by:
                  id: 10
                  full_name: Иванов Иван Иванович
                  email: ivanov@example.com
                  phone: "+79000000000"
                approver:
                  id: 2
                  full_name: Петров Петр Петрович
                  email: petrov@example.com
                  phone: "+79000000000"
                organization:
                  id: 1
                  name: ООО Ромашка
                comments:
                  - content: Заявка требует корректировки
                    created_by:
                      id: 2
                      full_name: Петров Петр Петрович
                created_at: 2026-06-15T10:30:00Z
                updated_at: 2026-06-15T12:00:00Z

        '401':
          $ref: "../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../common/responses.yaml#/components/responses/ForbiddenErrorResponse"

        '404':
          $ref: "../common/responses.yaml#/components/responses/NotFoundErrorResponse"

        '429':
          $ref: "../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../common/responses.yaml#/components/responses/InternalServerErrorResponse"

    put:
      tags:
        - Applications
      summary: Полное обновление заявки
      description: |
        Полное обновление заявки по ID.

      operationId: replaceApplication

      security:
        - BearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "../common/parameters.yaml#/components/parameters/IdempotencyKeyHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/UpdateApplicationRequest"

            examples:

              draftUpdate:
                summary: Обновление черновика
                description: |
                  Редактирование заявки в статусе "Черновик".
                  Заявка остается в статусе черновика.
                value:
                  number_application: APP-2026-0001
                  course_id: 5
                  start_date: "2026-06-15"
                  end_date: "2026-06-20"
                  application_state_id: 1
                  approver_id: null
                  student_emails:
                    - ivanov@example.com


              submitUpdate:
                summary: Редактирование заявки и отправка на рассмотрение
                description: |
                  Используется:
                  - для заявки, отправленной на корректировку;
                  - для отправки заполненного черновика на рассмотрение.
                value:
                  number_application: APP-2026-0001
                  course_id: 5
                  start_date: "2026-06-15"
                  end_date: "2026-06-20"
                  application_state_id: 2
                  approver_id: 10
                  student_emails:
                    - ivanov@example.com
                    - petrov@example.com
                  comments:
                    - id: 1
                      content: Исправлен список сотрудников
                      created_by:
                        id: 10
                        full_name: Иванов Иван Иванович
                      created_at: "2026-06-15T12:00:00Z"

                    - id: 2
                      content: Добавлены новые участники обучения
                      created_by:
                        id: 11
                        full_name: Петров Петр Петрович
                      created_at: "2026-06-16T09:30:00Z"

      responses:
        '200':
          description: Заявка успешно обновлена
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ApplicationDetailsResponse"

        '400':
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ApplicationErrorResponse"
              examples:
                duplicateStudents:
                  $ref: "./examples.yaml#/DuplicateStudentsInApplicationExample"
                studentsNotFound:
                  $ref: "./examples.yaml#/StudentsNotFoundInApplicationExample"
                courseNotFound:
                  $ref: "./examples.yaml#/CourseNotFoundInApplicationExample"
                validationError:
                  $ref: "./examples.yaml#/ValidationErrorExample"

        '401':
          $ref: "../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../common/responses.yaml#/components/responses/ForbiddenErrorResponse"
          content:
            application/json:
              examples:
                applicationUpdateForbiddenNotCreator:
                  $ref: "./examples.yaml#/ApplicationUpdateForbiddenNotCreator"

        '404':
          $ref: "../common/responses.yaml#/components/responses/NotFoundErrorResponse"

        '429':
          $ref: "../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../common/responses.yaml#/components/responses/InternalServerErrorResponse"

    patch:
      tags:
        - Applications
      summary: Изменить статус заявки
      description: >
        Используется согласующим для принятия решения по заявке.
        Поддерживает согласование, отклонение и отправку заявки на корректировку.
      operationId: patchApplicationState
      security:
        - BearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: ID заявки
          schema:
            type: integer
          example: 1
        - $ref: "../common/parameters.yaml#/components/parameters/IdempotencyKeyHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/PatchApplicationStateRequest"

            examples:
              approve:
                summary: Согласование заявки
                value:
                  application_state_id: 2

              correction:
                summary: Отправка на корректировку
                value:
                  application_state_id: 3
                  comment: Необходимо скорректировать список сотрудников

      responses:
        '200':
          description: Решение по заявке успешно принято
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/PatchApplicationStateResponse"
              example:
                message: Решение по заявке принято

        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: "../common/models.yaml#/components/schemas/ErrorResponse"
              examples:
                invalidApplicationStateTransition:
                  $ref: "./examples.yaml#/InvalidApplicationStateTransitionExample"

        '401':
          $ref: "../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: "../common/models.yaml#/components/schemas/ErrorResponse"
              examples:
                applicationAuthorCannotApprove:
                  $ref: "./examples.yaml#/ApplicationAuthorCannotApproveExample"

        '404':
          $ref: "../common/responses.yaml#/components/responses/NotFoundErrorResponse"

        '429':
          $ref: "../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../common/responses.yaml#/components/responses/InternalServerErrorResponse"

    delete:
      tags:
        - Applications
      summary: Удаление черновика заявки
      description: |
        Удаляет заявку только в статусе «Черновик».

        Если заявка находится в другом статусе, удаление невозможно.

        Удаление доступно только создателю заявки.
      operationId: deleteApplicationDraft
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID заявки
          schema:
            type: integer
            format: int64
          example: 1
        - $ref: "../common/parameters.yaml#/components/parameters/IdempotencyKeyHeader"
      responses:
        '204':
          description: Черновик заявки успешно удален
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Сообщение о результате удаления
                    example: Черновик заявки успешно удален
              example:
                message: Черновик заявки успешно удален

        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: "../common/models.yaml#/components/schemas/ErrorResponse"
              examples:
                applicationDeleteForbiddenByState:
                  $ref: "./examples.yaml#/ApplicationDeleteForbiddenByState"

        '401':
          $ref: "../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../common/responses.yaml#/components/responses/ForbiddenErrorResponse"

        '404':
          $ref: "../common/responses.yaml#/components/responses/NotFoundErrorResponse"

        '429':
          $ref: "../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../common/responses.yaml#/components/responses/InternalServerErrorResponse"

  /applications/downloads:
    get:
      tags:
        - Applications
      summary: Скачивание шаблона Excel для загрузки учеников
      description: |
        Возвращает Excel-шаблон установленного формата для заполнения списка учеников.

        Пользователь обязан заполнить колонку **student_email** — именно по email система идентифицирует сотрудников при загрузке.
        Колонка **student_email** должна содержать корректные email-адреса сотрудников.
        Каждая строка соответствует одному ученику. Email используется как ключ идентификации.

        Файл используется для массового добавления сотрудников в заявку.
      operationId: downloadApplicationStudentsTemplate
      security:
        - BearerAuth: []

      responses:
        '200':
          description: Excel-шаблон успешно сформирован
          headers:
            Content-Disposition:
              description: Имя файла для скачивания
              schema:
                type: string
                example: attachment; filename="application_students_template.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

        '401':
          $ref: "../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../common/responses.yaml#/components/responses/ForbiddenErrorResponse"

        '429':
          $ref: "../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../common/responses.yaml#/components/responses/InternalServerErrorResponse"

    post:
      tags:
        - Applications
      summary: Скачивание выбранных заявок
      description: |
        Формирует файл для скачивания выбранных заявок.

        Поведение:
        - если передан 1 application_id → возвращается PDF файл
        - если передано >1 application_id → возвращается ZIP архив с PDF файлами заявок

      operationId: downloadApplications
      security:
        - BearerAuth: []

      parameters:
        - $ref: "../common/parameters.yaml#/components/parameters/IdempotencyKeyHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - application_ids
              properties:
                application_ids:
                  type: array
                  description: Список ID заявок для скачивания
                  minItems: 1
                  items:
                    type: integer
                  example: [1, 2, 3]
            example:
              application_ids: [1, 2, 3]

      responses:
        '200':
          description: Файл с заявками успешно сформирован
          headers:
            Content-Disposition:
              description: Имя файла
              schema:
                type: string
                example: attachment; filename="applications.zip"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
              example: <binary pdf data>
            application/zip:
              schema:
                type: string
                format: binary
              example: <binary zip archive>

        '400':
          $ref: "../common/responses.yaml#/components/responses/BadRequestErrorResponse"

        '401':
          $ref: "../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../common/responses.yaml#/components/responses/ForbiddenErrorResponse"

        '404':
          $ref: "../common/responses.yaml#/components/responses/NotFoundErrorResponse"

        '429':
          $ref: "../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../common/responses.yaml#/components/responses/InternalServerErrorResponse"

  /applications/downloads/excel:
    post:
      tags:
        - Applications
      summary: Скачивание списка заявок в Excel
      description: |
        Формирует Excel-файл со списком заявок по переданным фильтрам.

        Фильтры идентичны фильтрам метода получения списка заявок.

        Если фильтры не переданы, возвращаются все заявки,
        доступные пользователю с учетом его роли и прав доступа.

      operationId: downloadApplicationsExcel
      security:
        - BearerAuth: []

      parameters:
        - $ref: "../common/parameters.yaml#/components/parameters/IdempotencyKeyHeader"

      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/ApplicationListFilters"

      responses:
        '200':
          description: Excel-файл со списком заявок успешно сформирован
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="applications.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

        '400':
          $ref: "../common/responses.yaml#/components/responses/BadRequestErrorResponse"

        '401':
          $ref: "../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../common/responses.yaml#/components/responses/ForbiddenErrorResponse"

        '429':
          $ref: "../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../common/responses.yaml#/components/responses/InternalServerErrorResponse"

  /applications/webhooks/status:
    post:
      tags:
        - Applications

      summary: Webhook обновления статуса заявки от СДО

      description: |
        Endpoint для получения статусов заявок от СДО.

        СДО отправляет изменения статуса заявки в Портал.

        Поддерживаемые статусы:
        - accepted → заявка переведена в статус "Принята СДО"
        - completed → заявка переведена в статус "Завершена"
        - postponed → заявка переведена в статус "Отложена СДО" (обязательно требуется комментарий с причиной)

      operationId: receiveLmsApplicationStatus

      security:
        - LmsWebhookAuth: []

      parameters:
        - $ref: "../common/parameters.yaml#/components/parameters/IdempotencyKeyHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/LmsApplicationWebhookRequest"

            examples:

              accepted:
                summary: Заявка принята
                value:
                  number_application: APP-2026-0001
                  status: accepted

              completed:
                summary: Обучение завершено
                value:
                  number_application: APP-2026-0002
                  status: completed

              postponed:
                summary: Обучение отложено
                value:
                  number_application: APP-2026-0003
                  status: postponed
                  comment: Перенос из-за отсутствия группы

      responses:
        '200':
          description: Webhook успешно обработан
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Статус заявки обновлён

        '400':
          description: Ошибка валидации webhook
          content:
            application/json:
              schema:
                $ref: "../common/models.yaml#/components/schemas/ErrorResponse"
              example:
                code: VALIDATION_ERROR
                message: Некорректные данные webhook
                details:
                  - field: number_application
                    message: Обязательное поле
                  - field: status
                    message: Недопустимый статус
                  - field: comment
                    message: Обязателен при статусе postponed

        '401':
          $ref: "../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../common/responses.yaml#/components/responses/ForbiddenErrorResponse"

        '404':
          description: Заявка не найдена в Портале
          content:
            application/json:
              schema:
                $ref: "../common/models.yaml#/components/schemas/ErrorResponse"
              example:
                code: NOT_FOUND
                message: Заявка не найдена

        '429':
          $ref: "../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../common/responses.yaml#/components/responses/InternalServerErrorResponse"
