paths:
  /applications:
    get:
      tags:
        - Applications
      summary: Получить список заявок на обучение
      description: >
        Возвращает список заявок с учётом роли текущего пользователя.
        Заявитель видит свои заявки, Согласующий — доступные ему заявки.
        Если список пустой, возвращается 200 с пустым массивом applications.
      operationId: getApplications
      security:
        - bearerAuth: []

      parameters:
        - name: search
          in: query
          schema:
            type: string

        - name: application_state_id
          in: query
          schema:
            type: integer

        - name: organization_id
          in: query
          schema:
            type: integer

        - name: created_by
          in: query
          schema:
            type: integer

        - name: approver_id
          in: query
          schema:
            type: integer

        - name: sort_by
          in: query
          schema:
            type: string
            enum:
              - number_application
              - updated_at
              - course_name
              - organization_name
              - created_by_full_name
              - approver_full_name

        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc

        - $ref: "../common/parameters.yaml#/components/parameters/PageParam"

        - $ref: "../common/parameters.yaml#/components/parameters/SizeParam"

      responses:
        '200':
          description: Список заявок успешно получен
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ApplicationsListResponse"

        '400':
          $ref: "../common/responses.yaml#/components/responses/BadRequestErrorResponse"

        '401':
          $ref: "../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../common/responses.yaml#/components/responses/ForbiddenErrorResponse"

        '429':
          $ref: "../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../common/responses.yaml#/components/responses/InternalServerErrorResponse"

    post:
      tags:
        - Applications
      summary: Создать заявку (черновик или на рассмотрение)
      description: >
        Создаёт заявку на обучение.
        Поддерживает создание черновика и отправку на рассмотрение.
      operationId: createApplication
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/CreateApplicationRequest"

      responses:
        '200':
          description: Заявка успешно создана или сохранена как черновик
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - message
                properties:
                  number_application:
                    type: string
                    description: Номер заявки
                    example: APP-2026-0001

                  message:
                    type: string
                    description: Результат операции
                    example: Заявка успешно создана
              examples:
                created:
                  summary: Заявка отправлена на рассмотрение
                  value:
                    number_application: APP-2026-0001
                    message: Заявка успешно создана

                draft:
                  summary: Черновик создан
                  value:
                    number_application: APP-2026-0002
                    message: Черновик создан

        '400':
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ApplicationErrorResponse"
              examples:
                duplicateStudents:
                  $ref: "./examples.yaml#/DuplicateStudentsInApplicationExample"
                studentsNotFound:
                  $ref: "./examples.yaml#/StudentsNotFoundInApplicationExample"
                courseNotFound:
                  $ref: "./examples.yaml#/CourseNotFoundInApplicationExample"
                validationError:
                  $ref: "./examples.yaml#/ValidationErrorExample"

        '401':
          $ref: "../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../common/responses.yaml#/components/responses/ForbiddenErrorResponse"

        '404':
          $ref: "../common/responses.yaml#/components/responses/NotFoundErrorResponse"

        '429':
          $ref: "../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../common/responses.yaml#/components/responses/InternalServerErrorResponse"

  /applications/{id}:
    get:
      tags:
        - Applications
      summary: Получить заявку по ID
      description: >
        Возвращает полную карточку заявки на обучение.
      operationId: getApplicationById
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID заявки

      responses:
        '200':
          description: Заявка успешно получена
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ApplicationDetailsResponse"

              example:
                id: 1
                number_application: APP-2026-0001
                course:
                  id: 5
                  name: Основы информационной безопасности
                start_date: 2026-06-15
                end_date: 2026-06-20
                application_state:
                  id: 1
                  code: WAITING_REVIEW
                  name: Ожидает рассмотрения
                created_by:
                  id: 10
                  full_name: Иванов Иван Иванович
                  email: ivanov@example.com
                  phone: "+79000000000"
                approver:
                  id: 2
                  first_name: Пётр
                  last_name: Петров
                organization:
                  id: 1
                  name: ООО Ромашка
                students:
                  - id: 10
                    first_name: Иван
                    last_name: Иванов
                    email: ivanov@example.com
                    phone: "+79000000000"
                    position:
                      id: 1
                      name: Backend-разработчик
                    departament:
                      id: 1
                      name: Отдел разработки
                    organization:
                      id: 1
                      name: ООО Ромашка
                comments:
                  - content: Заявка требует корректировки
                    created_by:
                      id: 2
                      full_name: Петров Петр Петрович
                      email: petrov@example.com
                      phone: "+79000000000"
                created_at: 2026-06-15T10:30:00Z
                updated_at: 2026-06-15T12:00:00Z

        '401':
          $ref: "../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../common/responses.yaml#/components/responses/ForbiddenErrorResponse"

        '404':
          $ref: "../common/responses.yaml#/components/responses/NotFoundErrorResponse"

        '429':
          $ref: "../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../common/responses.yaml#/components/responses/InternalServerErrorResponse"

    put:
      tags:
        - Applications
      summary: Полное обновление заявки
      description: |
        Полное обновление заявки по ID.

      operationId: replaceApplication

      security:
        - BearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/UpdateApplicationRequest"

      responses:
        '200':
          description: Заявка успешно обновлена
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ApplicationDetailsResponse"

        '400':
          content:
            application/json:
              schema:
                $ref: "./errors.yaml#/components/schemas/ApplicationErrorResponse"
              examples:
                duplicateStudents:
                  $ref: "./examples.yaml#/DuplicateStudentsInApplicationExample"
                studentsNotFound:
                  $ref: "./examples.yaml#/StudentsNotFoundInApplicationExample"
                courseNotFound:
                  $ref: "./examples.yaml#/CourseNotFoundInApplicationExample"
                validationError:
                  $ref: "./examples.yaml#/ValidationErrorExample"

        '401':
          $ref: "../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../common/responses.yaml#/components/responses/ForbiddenErrorResponse"
          content:
            application/json:
              examples:
                applicationUpdateForbiddenNotCreator:
                  $ref: "./examples.yaml#/ApplicationUpdateForbiddenNotCreator"

        '404':
          $ref: "../common/responses.yaml#/components/responses/NotFoundErrorResponse"

        '429':
          $ref: "../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../common/responses.yaml#/components/responses/InternalServerErrorResponse"
