DuplicateStudentsInApplicationExample:
  summary: Обнаружены дубли студентов
  value:
    code: APPLICATION_VALIDATION_FAILED
    message: Ошибка бизнес-валидации
    errors:
      - field: student_emails
        message: Обнаружены дубли
        rows: [3, 8]

StudentsNotFoundInApplicationExample:
  summary: Студенты не найдены
  value:
    code: APPLICATION_VALIDATION_FAILED
    message: Ошибка бизнес-валидации
    errors:
      - field: student_emails
        message: Указанные студенты не найдены
        rows: [1, 2]

CourseNotFoundInApplicationExample:
  summary: Курс не найден
  value:
    code: APPLICATION_VALIDATION_FAILED
    message: Ошибка бизнес-валидации
    errors:
      - field: course_id
        message: Курс с указанным ID не существует

ValidationErrorExample:
  summary: Ошибка валидации обязательных полей
  value:
    code: APPLICATION_VALIDATION_FAILED
    message: Ошибка бизнес-валидации
    errors:
      - field: course_id
        message: Обязательное поле не заполнено
      - field: start_date
        message: Обязательное поле не заполнено
      - field: end_date
        message: Обязательное поле не заполнено
      - field: application_state_id
        message: Обязательное поле не заполнено
      - field: student_emails
        message: Обязательное поле не заполнено

ApplicationUpdateForbiddenNotCreator:
  summary: Редактирование недоступно — пользователь не является создателем заявки
  value:
    code: FORBIDDEN
    message: Редактирование заявки недоступно
    details:
      - field: created_by
        message: Редактирование доступно только создателю заявки

InvalidApplicationStateTransitionExample:
  summary: Недопустимый переход статуса заявки
  value:
    code: APPLICATION_STATE_TRANSITION_NOT_ALLOWED
    message: Невозможно изменить статус заявки
    errors:
      - field: application_state_id
        message: Заявка не может быть переведена в указанный статус из текущего состояния

ApplicationAuthorCannotApproveExample:
  summary: Автор заявки не может принимать решение
  value:
    code: APPLICATION_APPROVAL_FORBIDDEN
    message: Автор заявки не может принимать решение по заявке
    errors:
      - field: approver
        message: Пользователь, создавший заявку, не может рассматривать её как согласующий

ApplicationDeleteForbiddenByState:
  summary: Заявка не может быть удалена из-за текущего статуса
  value:
    code: APPLICATION_INVALID_STATE
    message: Заявка не может быть удалена
    errors:
      - field: application_state_id
        message: Удаление доступно только для заявок в статусе «Черновик»
