components:
  schemas:

    # =========================
    # PRIMITIVES
    # =========================

    ApplicationId:
      type: integer
      description: ID заявки
      example: 1

    ApplicationNumber:
      type: string
      description: Номер заявки
      example: APP-2026-0001

    ApplicationStartDate:
      type: string
      format: date
      description: Дата начала обучения
      example: "2026-06-15"

    ApplicationEndDate:
      type: string
      format: date
      description: Дата окончания обучения
      example: "2026-06-20"

    # =========================
    # CORE DOMAIN ENTITY
    # =========================

    Application:
      type: object
      description: Базовая сущность заявки на обучение
      required:
        - id
        - number_application
        - course
        - start_date
        - end_date
        - application_state
        - created_by
        - organization
        - created_at
        - updated_at
      properties:

        id:
          $ref: "#/components/schemas/ApplicationId"

        number_application:
          $ref: "#/components/schemas/ApplicationNumber"

        course:
          $ref: "../courses/models.yaml#/components/schemas/CourseShort"

        start_date:
          $ref: "#/components/schemas/ApplicationStartDate"

        end_date:
          $ref: "#/components/schemas/ApplicationEndDate"

        application_state:
          $ref: "../application_states/models.yaml#/components/schemas/ApplicationStateShort"

        created_by:
          $ref: "../users/models.yaml#/components/schemas/UserShort"

        approver:
          allOf:
            - $ref: "../employees/models.yaml#/components/schemas/EmployeeShort"
          nullable: true
          description: Согласующий заявки

        organization:
          $ref: "../organizations/models.yaml#/components/schemas/OrganizationShort"

        created_at:
          type: string
          format: date-time
          example: "2026-06-15T10:30:00Z"

        updated_at:
          type: string
          format: date-time
          example: "2026-06-15T12:00:00Z"

    # =========================
    # LIST ITEM
    # =========================

    ApplicationListItem:
      type: object
      description: Элемент списка заявок
      required:
        - id
        - number_application
        - course
        - start_date
        - end_date
        - application_state
        - created_by
        - organization
        - created_at
        - updated_at

      properties:
        id:
          $ref: "#/components/schemas/ApplicationId"

        number_application:
          $ref: "#/components/schemas/ApplicationNumber"

        course:
          $ref: "../courses/models.yaml#/components/schemas/CourseShort"

        start_date:
          $ref: "#/components/schemas/ApplicationStartDate"

        end_date:
          $ref: "#/components/schemas/ApplicationEndDate"

        application_state:
          $ref: "../application_states/models.yaml#/components/schemas/ApplicationStateShort"

        created_by:
          type: object
          description: Пользователь, создавший заявку
          required:
            - id
            - full_name
          properties:
            id:
              type: integer
              format: int64
              description: ID пользователя
              example: 1
            full_name:
              $ref: "../employees/models.yaml#/components/schemas/EmployeeFullName"

        approver:
          type: object
          nullable: true
          description: Согласующий заявки
          required:
            - id
            - full_name
          properties:
            id:
              type: integer
              format: int64
              description: ID согласующего
              example: 10

            full_name:
              $ref: "../employees/models.yaml#/components/schemas/EmployeeFullName"

        organization:
          $ref: "../organizations/models.yaml#/components/schemas/OrganizationShort"

        created_at:
          type: string
          format: date-time
          example: "2026-06-15T10:30:00Z"

        updated_at:
          type: string
          format: date-time
          example: "2026-06-15T12:00:00Z"

    # =========================
    # LIST RESPONSE
    # =========================

    ApplicationsListResponse:
      type: object
      required:
        - applications
        - pagination
      properties:
        applications:
          type: array
          description: Список заявок
          items:
            $ref: "#/components/schemas/ApplicationListItem"
        pagination:
          $ref: "../common/models.yaml#/components/schemas/PaginationMeta"

    # =========================
    # MAIN RESPONSE
    # =========================
    ApplicationDetailsResponse:
      allOf:
        - $ref: "#/components/schemas/Application"
        - type: object
          properties:
            students:
              type: array
              items:
                $ref: "../employees/models.yaml#/components/schemas/EmployeeShort"
            comments:
              type: array
              items:
                $ref: "../comments/models.yaml#/components/schemas/CommentResponse"

    PatchApplicationStateResponse:
      type: object
      description: Результат изменения статуса заявки
      required:
        - message
      properties:

        message:
          type: string
          description: Сообщение результата операции
          example: Решение по заявке принято

    # =========================
    # REQUEST BODIES
    # =========================

    ApplicationListFilters:
      type: object
      description: Фильтры для получения списка заявок

      allOf:
        - type: object
          properties:
            search:
              type: string
              description: Поиск по номеру заявки, названию курса или ФИО заявителя
              example: Java

            application_state_id:
              type: integer
              description: ID статуса заявки
              example: 1

            organization_id:
              type: integer
              description: ID организации
              example: 2

            course_id:
              type: integer
              description: ID курса
              example: 5

            start_date_from:
              type: string
              format: date
              description: Дата начала обучения (от)
              example: "2026-06-01"

            start_date_to:
              type: string
              format: date
              description: Дата начала обучения (до)
              example: "2026-06-30"

            end_date_from:
              type: string
              format: date
              example: "2026-06-01"

            end_date_to:
              type: string
              format: date
              example: "2026-06-30"

            created_at_from:
              type: string
              format: date
              example: "2026-06-01"

            created_at_to:
              type: string
              format: date
              example: "2026-06-30"

            sort_by:
              type: string
              enum:
                - number_application
                - course_name
                - application_state
                - organization
                - start_date
                - end_date
                - created_at
              example: created_at

            sort_direction:
              type: string
              enum:
                - asc
                - desc
              example: desc
        - $ref: "../common/models.yaml#/components/schemas/PaginationRequest"

    # =========================
    # POST REQUESTS
    # =========================

    CreateApplicationRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateApplicationSubmitRequest"
        - $ref: "#/components/schemas/CreateApplicationDraftRequest"

    CreateApplicationSubmitRequest:
      type: object
      required:
        - course_id
        - start_date
        - end_date
        - application_state_id
        - student_emails

      properties:

        course_id:
          $ref: "../courses/models.yaml#/components/schemas/CourseId"

        start_date:
          type: string
          format: date

        end_date:
          type: string
          format: date

        application_state_id:
          $ref: "../application_states/models.yaml#/components/schemas/ApplicationStateId"

        student_emails:
          type: array
          items:
            $ref: "../employees/models.yaml#/components/schemas/EmployeeEmail"
          nullable: true

    CreateApplicationDraftRequest:
      type: object
      required:
        - application_state_id

      properties:

        course_id:
          $ref: "../courses/models.yaml#/components/schemas/CourseId"
          nullable: true

        start_date:
          type: string
          format: date
          nullable: true

        end_date:
          type: string
          format: date
          nullable: true

        application_state_id:
          $ref: "../application_states/models.yaml#/components/schemas/ApplicationStateId"

        student_emails:
          type: array
          items:
            $ref: "../employees/models.yaml#/components/schemas/EmployeeEmail"
          nullable: true

    # =========================
    # PUT REQUESTS
    # =========================

    UpdateApplicationRequest:
      oneOf:
        - $ref: "#/components/schemas/UpdateApplicationDraftRequest"
        - $ref: "#/components/schemas/UpdateApplicationStrictRequest"

    UpdateApplicationDraftRequest:
      type: object
      description: Данные для обновления черновика
      required:
        - application_state_id

      properties:
        number_application:
          nullable: true
          $ref: "#/components/schemas/ApplicationNumber"

        course_id:
          nullable: true
          $ref: "../courses/models.yaml#/components/schemas/CourseId"

        start_date:
          nullable: true
          $ref: "#/components/schemas/ApplicationStartDate"

        end_date:
          nullable: true
          $ref: "#/components/schemas/ApplicationEndDate"

        approver_id:
          type: integer
          format: int64
          nullable: true
          description: ID согласующего сотрудника
          example: 10

        application_state_id:
          $ref: "../application_states/models.yaml#/components/schemas/ApplicationStateId"

        student_emails:
          type: array
          description: Список email сотрудников, записанных на обучение
          nullable: true
          items:
            $ref: "../employees/models.yaml#/components/schemas/EmployeeEmail"

    UpdateApplicationStrictRequest:
      type: object
      description: Данные для полного обновления заявки

      required:
        - number_application
        - course_id
        - start_date
        - end_date
        - application_state_id
        - approver_id
        - student_emails
        - comments

      properties:
        number_application:
          $ref: "#/components/schemas/ApplicationNumber"

        course_id:
          $ref: "../courses/models.yaml#/components/schemas/CourseId"

        start_date:
          $ref: "#/components/schemas/ApplicationStartDate"

        end_date:
          $ref: "#/components/schemas/ApplicationEndDate"

        approver_id:
          type: integer
          format: int64
          nullable: true
          description: ID согласующего сотрудника
          example: 10

        application_state_id:
          $ref: "../application_states/models.yaml#/components/schemas/ApplicationStateId"

        student_emails:
          type: array
          description: Список email сотрудников, записанных на обучение
          minItems: 1
          items:
            $ref: "../employees/models.yaml#/components/schemas/EmployeeEmail"

        comments:
          type: array
          nullable: true
          description: Список комментариев к заявке
          items:
            $ref: "../comments/models.yaml#/components/schemas/CommentResponse"

    # =========================
    # PATCH REQUESTS
    # =========================

    PatchApplicationStateRequest:
      oneOf:
        - $ref: "#/components/schemas/ApproveApplicationRequest"
        - $ref: "#/components/schemas/RejectApplicationRequest"


    ApproveApplicationRequest:
      type: object
      description: Согласование заявки
      required:
        - application_state_id
      properties:

        application_state_id:
          $ref: "../application_states/models.yaml#/components/schemas/ApplicationStateId"


    RejectApplicationRequest:
      type: object
      description: Отклонение заявки или отправка на корректировку
      required:
        - application_state_id
        - comment
      properties:

        application_state_id:
          $ref: "../application_states/models.yaml#/components/schemas/ApplicationStateId"

        comment:
          type: string
          description: Комментарий согласующего
          example: Необходимо скорректировать список сотрудников

    LmsApplicationWebhookRequest:
      oneOf:
        - $ref: "#/components/schemas/LmsApplicationWebhookAccepted"
        - $ref: "#/components/schemas/LmsApplicationWebhookCompleted"
        - $ref: "#/components/schemas/LmsApplicationWebhookPostponed"

      discriminator:
        propertyName: status

    LmsApplicationWebhookAccepted:
      type: object
      required:
        - number_application
        - status

      properties:
        number_application:
          type: string
          example: APP-2026-0001

        status:
          type: string
          enum: [accepted]
          example: accepted    

    LmsApplicationWebhookCompleted:
      type: object
      required:
        - number_application
        - status

      properties:
        number_application:
          type: string
          example: APP-2026-0002

        status:
          type: string
          enum: [completed]
          example: completed

    LmsApplicationWebhookPostponed:
      type: object
      required:
        - number_application
        - status
        - comment

      properties:
        number_application:
          type: string
          example: APP-2026-0003

        status:
          type: string
          enum: [postponed]
          example: postponed

        comment:
          type: string
          description: Причина переноса заявки
          example: Нет доступных мест в группе
