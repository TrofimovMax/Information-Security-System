components:
  schemas:

    ApplicationErrorResponse:
      type: object
      description: Единый формат ошибок бизнес-валидации заявок
      required:
        - code
        - message
      properties:

        code:
          type: string
          description: Код ошибки
          example: APPLICATION_VALIDATION_FAILED

        message:
          type: string
          description: Общее описание ошибки
          example: Ошибка бизнес-валидации

        errors:
          type: array
          description: Детализация ошибок по полям
          items:
            type: object
            required:
              - message
            properties:

              field:
                type: string
                description: Поле, в котором произошла ошибка
                example: courseName

              message:
                type: string
                description: Сообщение ошибки
                example: Обязательное поле не заполнено

              rows:
                type: array
                description: Индексы строк (если ошибка относится к списку)
                items:
                  type: integer
                example: [3, 8]
