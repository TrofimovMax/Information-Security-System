components:
  schemas:
    ErrorResponse:
      type: object
      description: Стандартная модель ошибки API
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Код ошибки
          example: BAD_REQUEST
        message:
          type: string
          description: Человекочитаемое описание ошибки
          example: Некорректный запрос
