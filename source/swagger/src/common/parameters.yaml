components:
  parameters:

    PageParam:
      name: page
      in: query
      required: false
      description: Номер страницы
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    SizeParam:
      name: size
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
