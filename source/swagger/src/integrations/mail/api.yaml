paths:
  /mail/notifications:
    post:
      tags:
        - Mail Integration

      summary: Отправка уведомления в почтовую службу

      description: |
        Портал передает в почтовую службу данные для отправки уведомления.

        Используется при изменении состояния заявки.

      operationId: sendMailNotification

      security:
        - MailServiceAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/MailNotificationRequest"

      responses:
        '202':
          description: Уведомление принято почтовой службой
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Уведомление принято в обработку

        '400':
          $ref: "../../common/responses.yaml#/components/responses/BadRequestErrorResponse"

        '401':
          $ref: "../../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../../common/responses.yaml#/components/responses/ForbiddenErrorResponse"

        '429':
          $ref: "../../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../../common/responses.yaml#/components/responses/InternalServerErrorResponse"
