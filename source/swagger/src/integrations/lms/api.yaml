paths:
  /lms/courses:
    get:
      tags:
        - LMS Integration

      summary: Получение списка курсов из СДО

      description: |
        Возвращает список доступных курсов из СДО.

        Полученные данные используются для синхронизации
        с локальной таблицей courses.

        В локальной базе сохраняются:
        - внешний идентификатор курса СДО;
        - название курса;
        - дата создания записи.

      operationId: getLmsCourses

      security:
        - LmsServiceAuth: []

      responses:

        '200':
          description: Список курсов успешно получен

          content:
            application/json:
              schema:
                type: object

                required:
                  - items

                properties:

                  items:
                    type: array
                    description: Список курсов из СДО

                    items:
                      $ref: "./models.yaml#/components/schemas/LmsCourse"


        '401':
          $ref: "../../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../../common/responses.yaml#/components/responses/ForbiddenErrorResponse"

        '429':
          $ref: "../../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../../common/responses.yaml#/components/responses/InternalServerErrorResponse"

  /lms/applications:
    post:
      tags:
        - LMS Integration

      summary: Передача согласованной заявки в СДО

      description: |
        Передает согласованную заявку на обучение в СДО.

        СДО получает:
        - идентификатор курса в СДО;
        - даты начала и окончания обучения;
        - URL webhook для обратных уведомлений;
        - список учеников с контактными данными.

        После получения заявки СДО принимает её на рассмотрение
        и возвращает HTTP 202 Accepted.

      operationId: sendApplicationToLms

      security:
        - LmsServiceAuth: []

      requestBody:
        required: true
        description: Данные заявки для передачи в СДО
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/LmsApplicationRequest"
            example:
              external_course_id: "LMS-COURSE-1005"
              start_date: "2026-06-15"
              end_date: "2026-06-20"
              number_application: "APP-2026-0001"
              webhook_url: "https://portal.example.com/api/v1/lms/webhooks/applications/state"
              students:
                - full_name: "Иванов Иван Иванович"
                  email: "ivanov@example.com"
                  phone: "+79000000000"
                  departament: "Отдел разработки"
                  position: "Backend-разработчик"

      responses:

        '202':
          description: Заявка принята СДО на рассмотрение
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/LmsApplicationAcceptedResponse"
              example:
                message: Заявка принята СДО на рассмотрение

        '400':
          description: Некорректные данные заявки
          content:
            application/json:
              schema:
                $ref: "../../common/models.yaml#/components/schemas/ErrorResponse"
              example:
                code: VALIDATION_ERROR
                message: Некорректные данные заявки
                details:
                  - field: external_course_id
                    message: Поле external_course_id обязательно для заполнения

                  - field: start_date
                    message: Поле start_date обязательно для заполнения

                  - field: end_date
                    message: Поле end_date обязательно для заполнения

                  - field: webhook_url
                    message: Поле webhook_url обязательно для заполнения

                  - field: students
                    message: Список учеников не может быть пустым

                  - field: students[0].contacts
                    message: Поле contacts обязательно для заполнения

                  - field: students[0].contacts.full_name
                    message: Поле full_name обязательно для заполнения

                  - field: students[0].contacts.email
                    message: Поле email обязательно для заполнения

                  - field: students[0].contacts.phone
                    message: Поле phone обязательно для заполнения

                  - field: students[0].position
                    message: Поле position обязательно для заполнения

                  - field: students[0].departament
                    message: Поле departament обязательно для заполнения

        '401':
          $ref: "../../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../../common/responses.yaml#/components/responses/ForbiddenErrorResponse"
        
        '404':
          description: Курс в СДО не найден
          content:
            application/json:
              schema:
                $ref: "../../common//models.yaml#/components/schemas/ErrorResponse"
              example:
                code: COURSE_NOT_FOUND
                message: Курс с указанным external_course_id не найден в СДО
                details:
                  - field: external_course_id
                    message: Курс LMS-COURSE-1005 не найден

        '429':
          $ref: "../../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../../common/responses.yaml#/components/responses/InternalServerErrorResponse"

  /lms/applications/status:
    post:
      tags:
        - LMS Integration

      summary: Получение статуса заявок в СДО

      description: |
        Возвращает текущий статус заявок в СДО по номерам заявок Портала.

        Если заявка найдена в СДО, возвращается её текущий статус:
        - pending — на рассмотрении;
        - accepted — принята;
        - completed — завершена;
        - postponed — отложена.

        Если заявка с указанным номером отсутствует в СДО,
        возвращается статус not_found.

      operationId: getLmsApplicationsStatus

      security:
        - LmsServiceAuth: []

      requestBody:
        required: true
        description: Список номеров заявок для проверки статуса
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/LmsApplicationStatusRequest"

            example:
              application_numbers:
                - APP-2026-0001
                - APP-2026-0002

      responses:
        '200':
          description: Статусы заявок успешно получены
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/LmsApplicationStatusResponse"

              example:
                applications:
                  - number_application: APP-2026-0001
                    status: pending
                    message: Заявка находится на рассмотрении СДО

                  - number_application: APP-2026-0002
                    status: accepted
                    message: Заявка принята СДО

                  - number_application: APP-2026-0003
                    status: completed
                    message: Обучение по заявке завершено

                  - number_application: APP-2026-0004
                    status: postponed
                    message: Обучение по заявке отложено

                  - number_application: APP-2026-0005
                    status: not_found
                    message: Заявка не найдена в СДО

        '400':
          description: Некорректные данные запроса
          content:
            application/json:
              schema:
                $ref: "../../common/models.yaml#/components/schemas/ErrorResponse"

              example:
                code: VALIDATION_ERROR
                message: Некорректные данные запроса
                details:
                  - field: application_numbers
                    message: Список номеров заявок не может быть пустым

        '401':
          $ref: "../../common/responses.yaml#/components/responses/UnauthorizedErrorResponse"

        '403':
          $ref: "../../common/responses.yaml#/components/responses/ForbiddenErrorResponse"

        '429':
          $ref: "../../common/responses.yaml#/components/responses/TooManyRequestsErrorResponse"

        '500':
          $ref: "../../common/responses.yaml#/components/responses/InternalServerErrorResponse"
