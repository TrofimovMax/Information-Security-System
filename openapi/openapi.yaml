openapi: 3.0.3

info:
  title: Training Requests API
  version: 1.0.0
  description: CRUD API для модуля «Заявки на обучение»

servers:
  - url: http://localhost:8080
    description: Local server

tags:
  - name: Auth
    description: Авторизация и данные текущего пользователя
  - name: Applications
    description: Работа с заявками на обучение

security:
  - BearerAuth: []

paths:
  /api/v1/users/current:
    $ref: './paths/users-current.yaml'
  /api/v1/applications:
    $ref: './paths/applications.yaml'
  /api/v1/applications/{id}:
    $ref: './paths/applications-id.yaml'

components:
  securitySchemes:
    BearerAuth:
      $ref: './components/securitySchemes.yaml'
  
  requestBodies:
    CreateApplicationRequestBody:
      $ref: './components/requestBodies/applications.yaml#/CreateApplicationRequestBody'
    UpdateApplicationRequestBody:
      $ref: './components/requestBodies/applications.yaml#/UpdateApplicationRequestBody'

  responses:
    GetCurrentUser200Response:
      $ref: './components/responses/users.yaml#/GetCurrentUser200Response'
    
    GetApplications200Response:
      $ref: './components/responses/applications.yaml#/GetApplications200Response'

    CreateApplication200Response:
      $ref: './components/responses/applications.yaml#/CreateApplication200Response'
    
    GetApplicationById200Response:
      $ref: './components/responses/applications.yaml#/GetApplicationById200Response'

    UpdateApplication200Response:
      $ref: './components/responses/applications.yaml#/UpdateApplication200Response'

    DeleteApplicationDraft200Response:
      $ref: './components/responses/applications.yaml#/DeleteApplicationDraft200Response'

    BadRequestErrorResponse:
      $ref: './components/responses/common.yaml#/BadRequestErrorResponse'
    UnauthorizedErrorResponse:
      $ref: './components/responses/common.yaml#/UnauthorizedErrorResponse'
    ForbiddenErrorResponse:
      $ref: './components/responses/common.yaml#/ForbiddenErrorResponse'
    NotFoundErrorResponse:
      $ref: './components/responses/common.yaml#/NotFoundErrorResponse'
    TooManyRequestsErrorResponse:
      $ref: './components/responses/common.yaml#/TooManyRequestsErrorResponse'
    InternalServerErrorResponse:
      $ref: './components/responses/common.yaml#/InternalServerErrorResponse'

  schemas:
    ApplicationsListResponse:
      $ref: './components/schemas/applications.yaml#/ApplicationsListResponse'

    CreateApplicationRequest:
      $ref: './components/schemas/applications.yaml#/CreateApplicationRequest'

    CreateApplicationResponse:
      $ref: './components/schemas/applications.yaml#/CreateApplicationResponse'

    ApplicationListItem:
      $ref: './components/schemas/applications.yaml#/ApplicationListItem'

    ApplicationEmployee:
      $ref: './components/schemas/applications.yaml#/ApplicationEmployee'

    ApplicationCourse:
      $ref: './components/schemas/applications.yaml#/ApplicationCourse'

    ApplicationState:
      $ref: './components/schemas/applications.yaml#/ApplicationState'

    ApplicationOrganization:
      $ref: './components/schemas/applications.yaml#/ApplicationOrganization'

    ApplicationUserShort:
      $ref: './components/schemas/applications.yaml#/ApplicationUserShort'

    ApplicationsPaginationMeta:
      $ref: './components/schemas/applications.yaml#/ApplicationsPaginationMeta'

    ApplicationDetailsResponse:
      $ref: './components/schemas/applications.yaml#/ApplicationDetailsResponse'

    UpdateApplicationRequest:
      $ref: './components/schemas/applications.yaml#/UpdateApplicationRequest'

    DeleteApplicationDraftResponse:
      $ref: './components/schemas/applications.yaml#/DeleteApplicationDraftResponse'

    ApplicationPerson:
      $ref: './components/schemas/applications.yaml#/ApplicationPerson'

    ApplicationComment:
      $ref: './components/schemas/applications.yaml#/ApplicationComment'

    ErrorResponse:
      $ref: './components/schemas/common.yaml'

    CurrentUserResponse:
      $ref: './components/schemas/users.yaml'

  examples:
    ApplicationCannotBeUpdatedByStateExample:
      $ref: './components/examples/applications.yaml#/ApplicationCannotBeUpdatedByStateExample'

    ApplicationUpdateForbiddenNotCreatorExample:
      $ref: './components/examples/applications.yaml#/ApplicationUpdateForbiddenNotCreatorExample'

    ApplicationNotDraftErrorExample:
      $ref: './components/examples/applications.yaml#/ApplicationNotDraftErrorExample'
