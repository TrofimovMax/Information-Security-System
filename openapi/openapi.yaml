openapi: 3.0.3

info:
  title: Training Requests API
  version: 1.0.0
  description: CRUD API для модуля «Заявки на обучение»

servers:
  - url: http://localhost:8080
    description: Local server

tags:
  - name: Auth
    description: Авторизация и данные текущего пользователя
  - name: Applications
    description: Работа с заявками на обучение
  - name: Students
    description: Поиск, фильтрация и загрузка учеников для заявок на обучение
  - name: Notifications
    description: Получение и фильтрация уведомлений пользователя

security:
  - BearerAuth: []

paths:
  /api/v1/users/current:
    $ref: './paths/users-current.yaml'
  /api/v1/applications:
    $ref: './paths/applications.yaml'
  /api/v1/applications/{id}:
    $ref: './paths/applications-id.yaml'
  /api/v1/applications/{id}/state:
    $ref: './paths/applications-id-state.yaml'
  /api/v1/applications/downloads:
    $ref: './paths/applications-downloads.yaml'
  /api/v1/applications/downloads/excel:
    $ref: './paths/applications-downloads-excel.yaml'
  /api/v1/students:
    $ref: './paths/students.yaml'
  /api/v1/notifications:
    $ref: './paths/notifications.yaml'
components:
  securitySchemes:
    BearerAuth:
      $ref: './components/securitySchemes.yaml'
  
  requestBodies:
    CreateApplicationRequestBody:
      $ref: './components/requestBodies/applications.yaml#/CreateApplicationRequestBody'
    UpdateApplicationRequestBody:
      $ref: './components/requestBodies/applications.yaml#/UpdateApplicationRequestBody'
    ChangeApplicationStateRequestBody:
      $ref: './components/requestBodies/applications.yaml#/ChangeApplicationStateRequestBody'
    DownloadApplicationsRequestBody:
      $ref: './components/requestBodies/applications.yaml#/DownloadApplicationsRequestBody'
    DownloadApplicationsExcelRequestBody:
      $ref: './components/requestBodies/applications.yaml#/DownloadApplicationsExcelRequestBody'
    UploadStudentsExcelRequestBody:
      $ref: './components/requestBodies/students.yaml#/UploadStudentsExcelRequestBody'

  responses:
    GetCurrentUser200Response:
      $ref: './components/responses/users.yaml#/GetCurrentUser200Response'
    
    GetApplications200Response:
      $ref: './components/responses/applications.yaml#/GetApplications200Response'

    CreateApplication200Response:
      $ref: './components/responses/applications.yaml#/CreateApplication200Response'
    
    GetApplicationById200Response:
      $ref: './components/responses/applications.yaml#/GetApplicationById200Response'

    UpdateApplication200Response:
      $ref: './components/responses/applications.yaml#/UpdateApplication200Response'

