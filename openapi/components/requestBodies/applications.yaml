CreateApplicationRequestBody:
  description: Данные для создания заявки на обучение
  required: true
  content:
    application/json:
      schema:
        $ref: '../schemas/applications.yaml#/CreateApplicationRequest'
      example:
        course_id: 5
        start_date: '2026-06-15'
        end_date: '2026-06-20'
        application_state_id: 1
        employee_ids:
          - 10
          - 11
          - 12

UpdateApplicationRequestBody:
  description: Данные для обновления заявки на обучение
  required: true
  content:
    application/json:
      schema:
        $ref: '../schemas/applications.yaml#/UpdateApplicationRequest'
      example:
        course_id: 5
        start_date: '2026-07-01'
        end_date: '2026-07-10'
        employee_ids:
          - 10
          - 11
          - 12

ChangeApplicationStateRequestBody:
  description: Данные для изменения статуса заявки
  required: true
  content:
    application/json:
      schema:
        $ref: '../schemas/applications.yaml#/ChangeApplicationStateRequest'
      example:
        application_state_id: 3
        comment: Необходимо скорректировать список учеников

DownloadApplicationsRequestBody:
  description: Список заявок для скачивания
  required: true
  content:
    application/json:
      schema:
        $ref: '../schemas/applications.yaml#/DownloadApplicationsRequest'
      example:
        application_ids:
          - 1
          - 2
          - 3

DownloadApplicationsExcelRequestBody:
  description: Фильтры для скачивания списка заявок в Excel
  required: false
  content:
    application/json:
      schema:
        $ref: '../schemas/applications.yaml#/DownloadApplicationsExcelRequest'
      example:
        search: Java
        application_state_id: 1
        organization_id: 2
        course_id: 5
        start_date_from: '2026-06-01'
        start_date_to: '2026-06-30'
        end_date_from: '2026-06-01'
        end_date_to: '2026-06-30'
        created_at_from: '2026-06-01'
        created_at_to: '2026-06-30'
        sort_by: created_at
        sort_direction: desc
