LmsApplicationStateWebhookRequestBody:
  description: Событие СДО об изменении состояния заявки на обучение
  required: true
  content:
    application/json:
      schema:
        $ref: '../schemas/lms-webhooks.yaml#/LmsApplicationStateWebhookRequest'
      examples:
        accepted:
          summary: СДО приняла заявку
          value:
            event_type: accepted
            event_datetime: '2026-06-17T10:00:00Z'
            comment: Заявка принята СДО

        completed:
          summary: Обучение завершено
          value:
            event_type: completed
            event_datetime: '2026-06-25T15:30:00Z'
            completion_date: '2026-06-25'
            comment: Обучение по заявке завершено

        postponed:
          summary: Обучение отложено
          value:
            event_type: postponed
            event_datetime: '2026-06-18T09:15:00Z'
            postponed_until: '2026-07-01'
            comment: Обучение отложено по причине переноса курса
