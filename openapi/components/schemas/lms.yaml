LmsCourse:
  type: object
  required:
    - id
    - name
    - start_date
    - end_date
    - status
  properties:
    id:
      type: integer
      description: ID курса в СДО
      example: 5

    name:
      type: string
      description: Название курса
      example: Основы информационной безопасности

    start_date:
      type: string
      format: date
      description: Дата начала курса
      example: '2026-06-15'

    end_date:
      type: string
      format: date
      description: Дата окончания курса
      example: '2026-06-20'

    status:
      type: string
      description: Состояние курса
      enum:
        - active
        - future
      example: future

LmsCoursesPaginationMeta:
  type: object
  required:
    - page
    - per_page
    - total
    - total_pages
  properties:
    page:
      type: integer
      description: Текущая страница
      example: 1

    per_page:
      type: integer
      description: Количество записей на странице
      example: 20

    total:
      type: integer
      description: Общее количество записей
      example: 100

    total_pages:
      type: integer
      description: Общее количество страниц
      example: 5

LmsCoursesListResponse:
  type: object
  required:
    - items
    - meta
  properties:
    items:
      type: array
      description: Список актуальных курсов из СДО
      items:
        $ref: '#/LmsCourse'

    meta:
      $ref: '#/LmsCoursesPaginationMeta'

LmsApplicationCourse:
  type: object
  required:
    - id
    - external_course_id
    - name
    - start_date
    - end_date
  properties:
    id:
      type: integer
      description: ID курса в Портале
      example: 5

    external_course_id:
      type: string
      description: ID курса на стороне СДО
      example: LMS-COURSE-1005

    name:
      type: string
      description: Название курса
      example: Основы информационной безопасности

    start_date:
      type: string
      format: date
      description: Дата начала курса
      example: '2026-06-15'

    end_date:
      type: string
      format: date
      description: Дата окончания курса
      example: '2026-06-20'

LmsApplicationPerson:
  type: object
  required:
    - id
    - first_name
    - last_name
  properties:
    id:
      type: integer
      description: ID пользователя или сотрудника
      example: 10

    first_name:
      type: string
      description: Имя
      example: Иван

    middle_name:
      type: string
      nullable: true
      description: Отчество
      example: Иванович

    last_name:
      type: string
      description: Фамилия
      example: Иванов

    email:
      type: string
      format: email
      nullable: true
      description: Email
      example: ivanov@example.com

    phone:
      type: string
      nullable: true
      description: Телефон
      example: '+79000000000'

LmsApplicationPosition:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: integer
      description: ID должности
      example: 1

    name:
      type: string
      description: Название должности
      example: Backend-разработчик

LmsApplicationDepartment:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: integer
      description: ID подразделения
      example: 1

    name:
      type: string
      description: Название подразделения
      example: Отдел разработки

LmsApplicationOrganization:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: integer
      description: ID организации
      example: 1

    name:
      type: string
      description: Название организации
      example: ООО Ромашка

LmsApplicationStudent:
  type: object
  required:
    - id
    - first_name
    - last_name
    - email
    - phone
    - position
    - departament
    - organization
  properties:
    id:
      type: integer
      description: ID сотрудника-ученика в Портале
      example: 10

    first_name:
      type: string
      description: Имя ученика
      example: Иван

    middle_name:
      type: string
      nullable: true
      description: Отчество ученика
      example: Иванович

    last_name:
      type: string
      description: Фамилия ученика
      example: Иванов

    email:
      type: string
      format: email
      description: Email ученика
      example: ivanov@example.com

    phone:
      type: string
      description: Телефон ученика
      example: '+79000000000'

    position:
      $ref: '#/LmsApplicationPosition'

    departament:
      $ref: '#/LmsApplicationDepartment'

    organization:
      $ref: '#/LmsApplicationOrganization'

CreateLmsApplicationRequest:
  type: object
  required:
    - portal_application_id
    - number_application
    - webhook_url
    - course
    - requester
    - students
    - sent_at
  properties:
    portal_application_id:
      type: integer
      description: ID заявки в Портале из таблицы applications
      example: 1

    number_application:
      type: string
      description: Номер заявки в Портале
      example: APP-2026-0001

    webhook_url:
      type: string
      format: uri
      description: URL webhook Портала, по которому СДО должна отправлять события по заявке
      example: https://portal.example.com/api/v1/lms/webhooks/applications/1/state

    course:
      $ref: '#/LmsApplicationCourse'

    requester:
      allOf:
        - $ref: '#/LmsApplicationPerson'
      description: Заявитель из таблицы employees

    approver:
      allOf:
        - $ref: '#/LmsApplicationPerson'
      nullable: true
      description: Согласующий из таблицы users

    students:
      type: array
      minItems: 1
      description: Сотрудники, записанные на курс в рамках заявки
      items:
        $ref: '#/LmsApplicationStudent'

    sent_at:
      type: string
      format: date-time
      description: Дата и время отправки заявки из Портала в СДО
      example: '2026-06-17T10:00:00Z'

CreateLmsApplicationAcceptedResponse:
  type: object
  required:
    - portal_application_id
    - number_application
    - lms_application_id
    - status
    - message
    - accepted_at
  properties:
    portal_application_id:
      type: integer
      description: ID заявки в Портале
      example: 1

    number_application:
      type: string
      description: Номер заявки в Портале
      example: APP-2026-0001

    lms_application_id:
      type: string
      description: ID созданной заявки на стороне СДО
      example: LMS-APP-10001

    status:
      type: string
      description: Технический статус приёма заявки на стороне СДО
      enum:
        - accepted_for_processing
      example: accepted_for_processing

    message:
      type: string
      description: Сообщение о результате приёма заявки
      example: Заявка принята СДО для обработки

    accepted_at:
      type: string
      format: date-time
      description: Дата и время принятия заявки СДО
      example: '2026-06-17T10:00:05Z'
