Notification:
  type: object
  required:
    - id
    - user_id
    - content
    - event_type
    - is_read
    - created_at
  properties:
    id:
      type: integer
      description: ID уведомления
      example: 1

    user_id:
      type: integer
      description: ID пользователя, которому адресовано уведомление
      example: 2

    content:
      type: string
      description: Текст уведомления
      example: Заявка APP-2026-0001 отправлена на согласование

    event_type:
      type: string
      description: Тип события уведомления
      example: application_created

    is_read:
      type: boolean
      description: Признак прочтения уведомления
      example: false

    application_id:
      type: integer
      nullable: true
      description: ID связанной заявки
      example: 10

    created_at:
      type: string
      format: date-time
      description: Дата и время создания уведомления
      example: '2026-06-17T10:00:00Z'

NotificationsPaginationMeta:
  type: object
  required:
    - page
    - per_page
    - total
    - total_pages
  properties:
    page:
      type: integer
      description: Текущая страница
      example: 1

    per_page:
      type: integer
      description: Количество записей на странице
      example: 20

    total:
      type: integer
      description: Общее количество записей
      example: 100

    total_pages:
      type: integer
      description: Общее количество страниц
      example: 5

NotificationsListResponse:
  type: object
  required:
    - items
    - meta
  properties:
    items:
      type: array
      description: Список уведомлений
      items:
        $ref: '#/Notification'

    meta:
      $ref: '#/NotificationsPaginationMeta'
