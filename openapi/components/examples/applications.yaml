ApplicationCannotBeUpdatedByStateExample:
  summary: Заявка не может быть обновлена из-за статуса
  value:
    code: BAD_REQUEST
    message: Заявка не может быть обновлена
    details:
      - field: application_state
        message: Заявка может быть обновлена только в статусе «Черновик» или «На корректировке»

ApplicationUpdateForbiddenNotCreatorExample:
  summary: Редактирование недоступно, пользователь не является создателем заявки
  value:
    code: FORBIDDEN
    message: Редактирование заявки недоступно
    details:
      - field: created_by
        message: Редактирование доступно только создателю заявки

ApplicationNotDraftErrorExample:
  summary: Заявка не в статусе «Черновик»
  value:
    code: BAD_REQUEST
    message: Заявка не может быть удалена
    details:
      - field: application_state
        message: Заявка может быть удалена только в статусе «Черновик»

InvalidApplicationStateTransitionExample:
  summary: Недопустимый переход статуса заявки
  value:
    code: BAD_REQUEST
    message: Статус заявки не может быть изменен
    details:
      - field: application_state_id
        message: Недопустимый переход статуса заявки

ApplicationStateCommentRequiredExample:
  summary: Комментарий обязателен для выбранного статуса
  value:
    code: BAD_REQUEST
    message: Комментарий обязателен
    details:
      - field: comment
        message: Комментарий обязателен при отклонении заявки или отправке на корректировку

ApplicationApproverIsCreatorExample:
  summary: Согласующий является создателем заявки
  value:
    code: FORBIDDEN
    message: Изменение статуса заявки недоступно
    details:
      - field: approver
        message: Согласующий не может рассматривать собственную заявку

ApplicationStateChangeForbiddenExample:
  summary: Нет доступа к изменению статуса заявки
  value:
    code: FORBIDDEN
    message: Доступ запрещен
    details:
      - field: application
        message: У пользователя нет прав на изменение статуса этой заявки

DuplicateStudentsInApplicationExample:
  summary: В заявке указаны дубли учеников
  value:
    code: BAD_REQUEST
    message: Найдены дубли в списке учеников
    details:
      - field: employee_ids
        message: Ученик с ID 10 повторяется в списке
      - field: employee_ids
        message: Ученик с ID 12 повторяется в списке

StudentsNotFoundInApplicationExample:
  summary: Один или несколько учеников не найдены
  value:
    code: BAD_REQUEST
    message: Один или несколько учеников не найдены
    details:
      - field: employee_ids
        message: Ученик с ID 999 не найден
      - field: employee_ids
        message: Ученик с ID 1000 не найден

CourseNotFoundInApplicationExample:
  summary: Курс не найден
  value:
    code: BAD_REQUEST
    message: Курс не найден
    details:
      - field: course_id
        message: Курс с ID 999 не найден
