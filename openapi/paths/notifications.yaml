get:
  tags:
    - Notifications
  summary: Получение уведомлений
  description: |
    Возвращает список уведомлений с возможностью фильтрации.

    Поддерживает:
    - фильтрацию по пользователю;
    - фильтрацию по признаку прочтения;
    - фильтрацию по заявке;
    - сортировку по ID;
    - пагинацию.
  operationId: getNotifications
  security:
    - BearerAuth: []
  parameters:
    - name: user_id
      in: query
      required: false
      description: ID пользователя, для которого необходимо получить уведомления
      schema:
        type: integer
      example: 1

    - name: is_read
      in: query
      required: false
      description: Признак прочтения уведомления
      schema:
        type: boolean
      example: false

    - name: application_id
      in: query
      required: false
      description: ID заявки, с которой связано уведомление
      schema:
        type: integer
      example: 10

    - name: sort_by
      in: query
      required: false
      description: Поле сортировки
      schema:
        type: string
        enum:
          - id
        default: id
      example: id

    - name: sort_direction
      in: query
      required: false
      description: Направление сортировки
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
      example: desc

    - name: page
      in: query
      required: false
      description: Номер страницы
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    - name: per_page
      in: query
      required: false
      description: Количество записей на странице
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

  responses:
    '200':
      $ref: '../components/responses/notifications.yaml#/GetNotifications200Response'
    '400':
      $ref: '../components/responses/common.yaml#/BadRequestErrorResponse'
    '401':
      $ref: '../components/responses/common.yaml#/UnauthorizedErrorResponse'
    '403':
      $ref: '../components/responses/common.yaml#/ForbiddenErrorResponse'
    '429':
      $ref: '../components/responses/common.yaml#/TooManyRequestsErrorResponse'
    '500':
      $ref: '../components/responses/common.yaml#/InternalServerErrorResponse'
