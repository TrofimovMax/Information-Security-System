post:
  tags:
    - LMS Webhooks
  summary: Webhook изменения состояния заявки из СДО
  description: |
    Принимает событие от Системы дистанционного обучения об изменении состояния заявки на обучение.

    СДО передаёт тип события по заявке, а Портал выполняет внутреннюю обработку:
    - находит заявку по applications.id из path-параметра;
    - определяет новый статус заявки по event_type;
    - обновляет applications.application_state_id;
    - создаёт уведомление в notifications для applications.approver_id;
    - связывает уведомление с заявкой через notifications.application_id.

    Поддерживаемые события:
    - accepted — СДО приняла заявку на обучение;
    - completed — обучение по заявке завершено;
    - postponed — обучение по заявке отложено.
  operationId: receiveLmsApplicationStateWebhook
  security:
    - LmsWebhookAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: ID заявки в Портале
      schema:
        type: integer
      example: 1
  requestBody:
    $ref: '../components/requestBodies/lms-webhooks.yaml#/LmsApplicationStateWebhookRequestBody'
  responses:
    '202':
      $ref: '../components/responses/lms-webhooks.yaml#/LmsApplicationStateWebhook202Response'
    '400':
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common.yaml'
          examples:
            applicationInvalidStateForLmsEvent:
              $ref: '../components/examples/lms-webhooks.yaml#/ApplicationInvalidStateForLmsEventExample'
            applicationApproverNotAssigned:
              $ref: '../components/examples/lms-webhooks.yaml#/ApplicationApproverNotAssignedExample'
    '401':
      $ref: '../components/responses/common.yaml#/UnauthorizedErrorResponse'
    '403':
      $ref: '../components/responses/common.yaml#/ForbiddenErrorResponse'
    '404':
      $ref: '../components/responses/common.yaml#/NotFoundErrorResponse'
    '429':
      $ref: '../components/responses/common.yaml#/TooManyRequestsErrorResponse'
    '500':
      $ref: '../components/responses/common.yaml#/InternalServerErrorResponse'
