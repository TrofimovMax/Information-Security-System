post:
  tags:
    - LMS
  summary: Передать заявку на обучение в СДО
  description: |
    Принимает заявку на обучение от Портала.

    Метод вызывается Порталом после согласования заявки.
    Портал передаёт в СДО данные заявки, список учеников и ссылку на webhook,
    по которой СДО должна отправлять события по заявке.

    СДО принимает заявку в обработку и возвращает технический идентификатор заявки на стороне СДО.

    После дальнейшей обработки СДО уведомляет Портал через webhook_url:
    - accepted — заявка принята СДО;
    - completed — обучение завершено;
    - postponed — обучение отложено.
  operationId: createLmsApplication
  security:
    - LmsApiAuth: []
  requestBody:
    $ref: '../components/requestBodies/lms.yaml#/CreateLmsApplicationRequestBody'
  responses:
    '202':
      $ref: '../components/responses/lms.yaml#/CreateLmsApplication202Response'
    '400':
      $ref: '../components/responses/common.yaml#/BadRequestErrorResponse'
    '401':
      $ref: '../components/responses/common.yaml#/UnauthorizedErrorResponse'
    '403':
      $ref: '../components/responses/common.yaml#/ForbiddenErrorResponse'
    '404':
      $ref: '../components/responses/common.yaml#/NotFoundErrorResponse'
    '429':
      $ref: '../components/responses/common.yaml#/TooManyRequestsErrorResponse'
    '500':
      $ref: '../components/responses/common.yaml#/InternalServerErrorResponse'
