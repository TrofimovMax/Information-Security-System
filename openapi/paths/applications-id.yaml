get:
  tags:
    - Applications
  summary: Получить заявку по ID
  description: >
    Возвращает карточку заявки на обучение, включая данные курса, статуса,
    заявителя, согласующего, сотрудников, записанных на курс, и комментарии.
  operationId: getApplicationById
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: ID заявки
      schema:
        type: integer
      example: 1
  responses:
    '200':
      $ref: '../components/responses/applications.yaml#/GetApplicationById200Response'
    '401':
      $ref: '../components/responses/common.yaml#/UnauthorizedErrorResponse'
    '403':
      $ref: '../components/responses/common.yaml#/ForbiddenErrorResponse'
    '404':
      $ref: '../components/responses/common.yaml#/NotFoundErrorResponse'
    '429':
      $ref: '../components/responses/common.yaml#/TooManyRequestsErrorResponse'
    '500':
      $ref: '../components/responses/common.yaml#/InternalServerErrorResponse'

put:
  tags:
    - Applications
  summary: Полное обновление заявки
  description: |
    Полное обновление заявки по указанному ID.

    Запрос содержит полную репрезентацию ресурса заявки:
    все поля заявки должны быть переданы, включая идентификаторы курса,
    сотрудников, заявителя и согласующего.

    Обновление заменяет текущее состояние заявки значениями из запроса.

    Валидация выполняется после применения данных и зависит от текущего статуса заявки.

    Возможные ошибки:
    - 400 — заявка не может быть обновлена в текущем статусе или нарушены бизнес-правила
    - 403 — пользователь не является создателем заявки
  operationId: replaceApplication
  security:
    - BearerAuth: []

  parameters:
    - name: id
      in: path
      required: true
      description: ID заявки
      schema:
        type: integer
      example: 1

  requestBody:
    $ref: '../components/requestBodies/applications.yaml#/UpdateApplicationRequestBody'

  responses:
    '200':
      $ref: '../components/responses/applications.yaml#/UpdateApplication200Response'

    '400':
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common.yaml'
          examples:
            applicationCannotBeUpdatedByState:
              $ref: '../components/examples/applications.yaml#/ApplicationCannotBeUpdatedByStateExample'

    '401':
      $ref: '../components/responses/common.yaml#/UnauthorizedErrorResponse'

    '403':
      description: Доступ запрещен
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common.yaml'
          examples:
            applicationUpdateForbiddenNotCreator:
              $ref: '../components/examples/applications.yaml#/ApplicationUpdateForbiddenNotCreatorExample'

    '404':
      $ref: '../components/responses/common.yaml#/NotFoundErrorResponse'

    '429':
      $ref: '../components/responses/common.yaml#/TooManyRequestsErrorResponse'

    '500':
      $ref: '../components/responses/common.yaml#/InternalServerErrorResponse'

patch:
  tags:
    - Applications
  summary: Изменение заявки (статуса)
  description: |
    Частичное обновление заявки.

    Используется для изменения статуса заявки в процессе согласования:

    - согласование заявки
    - отклонение заявки
    - отправка на корректировку

    В запросе передается новый статус через `application_state_id`.

    Комментарий:
    - обязателен для некоторых переходов статуса (например: отклонение, корректировка)
    - для согласования может быть не передан

    Остальные поля заявки не изменяются.
  operationId: patchApplicationState
  security:
    - BearerAuth: []

  parameters:
    - name: id
      in: path
      required: true
      description: ID заявки
      schema:
        type: integer
      example: 1

  requestBody:
    $ref: '../components/requestBodies/applications.yaml#/ChangeApplicationStateRequestBody'

  responses:
    '200':
      $ref: '../components/responses/applications.yaml#/ChangeApplicationState200Response'

    '400':
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common.yaml'
          examples:
            invalidApplicationStateTransition:
              $ref: '../components/examples/applications.yaml#/InvalidApplicationStateTransitionExample'
            commentRequired:
              $ref: '../components/examples/applications.yaml#/ApplicationStateCommentRequiredExample'

    '401':
      $ref: '../components/responses/common.yaml#/UnauthorizedErrorResponse'

    '403':
      description: Доступ запрещен
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common.yaml'
          examples:
            approverIsCreator:
              $ref: '../components/examples/applications.yaml#/ApplicationApproverIsCreatorExample'
            noApplicationAccess:
              $ref: '../components/examples/applications.yaml#/ApplicationStateChangeForbiddenExample'

    '404':
      $ref: '../components/responses/common.yaml#/NotFoundErrorResponse'

    '429':
      $ref: '../components/responses/common.yaml#/TooManyRequestsErrorResponse'

    '500':
      $ref: '../components/responses/common.yaml#/InternalServerErrorResponse'

delete:
  tags:
    - Applications
  summary: Удаление черновика заявки
  description: Удаляет заявку только в статусе «Черновик». Если заявка находится в другом статусе, удаление не выполняется.
  operationId: deleteApplicationDraft
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: ID заявки
      schema:
        type: integer
      example: 1
  responses:
    '200':
      $ref: '../components/responses/applications.yaml#/DeleteApplicationDraft200Response'
    '400':
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common.yaml'
          examples:
            applicationNotDraft:
              $ref: '../components/examples/applications.yaml#/ApplicationNotDraftErrorExample'
    '401':
      $ref: '../components/responses/common.yaml#/UnauthorizedErrorResponse'
    '403':
      $ref: '../components/responses/common.yaml#/ForbiddenErrorResponse'
    '404':
      $ref: '../components/responses/common.yaml#/NotFoundErrorResponse'
    '429':
      $ref: '../components/responses/common.yaml#/TooManyRequestsErrorResponse'
    '500':
      $ref: '../components/responses/common.yaml#/InternalServerErrorResponse'
